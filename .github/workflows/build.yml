name: Dizi standalone UEFI + UniXNU (public only)

# No private repositories, GitHub-hosted runners, or prebuilt XNU.
# Explicit manual dispatch OR a trusted owner comment on control PR #1.
# NEVER triggers on push, pull_request, or synchronize.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

# Do not add a workflow-level concurrency gate: stalled workflow runs
# with zero created jobs can block all further manual dispatches.
env:
  MU_REPO: https://github.com/vildangil/Mu-Silicium.git
  MU_SHA: 39fbbc20885325044cfeaf8428efb7267e0bbe35
  MU_R4_SHA: 71b8dedd0c00f85eb5bcf10a647f0d698d81b6ac
  UNIXNU_REPO: https://github.com/UniXNU/UniXNU.git
  UNIXNU_SHA: 759eb61b6b8d475de5b3d1b39e1de1f5294e8d9a
  CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
  PYTHONUNBUFFERED: "1"
  CI_BUILD: "false"

jobs:
  uefi:
    # Only the repository owner's exact command on control PR #1 is accepted.
    # Other GitHub comments create at most a skipped run, never a build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'vildangil' &&
       github.event.comment.body == '/run-dizi-uefi')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preflight public-only dependencies and firmware-only menu
        run: |
          set -euo pipefail
          python3 -m py_compile ci/integrate_unixnu.py ci/patch_initrd_fat.py ci/patch_sec_entry_hob.py ci/patch_public_buttons.py ci/patch_native_pmic_r4.py
          python3 - <<'PY'
          import pathlib, tomllib
          w=pathlib.Path(".github/workflows/build.yml").read_text()
          assert ("dizi_" + "IpadOS_maybe") not in w
          assert "github.com/vildangil/Mu-Silicium.git" in w
          assert "github.com/UniXNU/UniXNU.git" in w
          data=tomllib.loads(pathlib.Path("ci/firmware-menu.toml").read_text())
          assert data["version"] == 1
          assert all(entry.get("type") == "action" for entry in data["entry"])
          assert data["boot"]["default"] == "return"
          print("No private dependencies and no unverified XNU payload")
          PY

      - name: Install public cross-compilation dependencies
        run: |
          set -euo pipefail
          echo "::group::Refreshing Ubuntu package lists (max 8 minutes)"
          timeout 480s sudo apt-get -o Acquire::Retries=2 update
          echo "::endgroup::"
          echo "::group::Installing EDK2 cross-build tools (max 15 minutes)"
          timeout 900s sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o DPkg::Lock::Timeout=180 -o Acquire::Retries=2 \
            install -y --no-install-recommends \
            clang-18 llvm-18 llvm-18-tools lld-18 nasm mono-devel \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu uuid-dev \
            python3-venv python3-pip make pkg-config curl git \
            dosfstools mtools
          echo "::endgroup::"
          echo "Host cross-build packages installed"
          mkdir -p "$RUNNER_TEMP/llvm-tools"
          for binary in llvm-lib lld-link llvm-objcopy; do
            if command -v "$binary" >/dev/null; then continue; fi
            candidate=""
            for p in "/usr/lib/llvm-18/bin/$binary" "/usr/bin/${binary}-18"; do
              if [ -x "$p" ]; then candidate="$p"; break; fi
            done
            test -n "$candidate" || { echo "::error::$binary not found"; exit 1; }
            ln -s "$candidate" "$RUNNER_TEMP/llvm-tools/$binary"
          done
          echo "$RUNNER_TEMP/llvm-tools" >> "$GITHUB_PATH"

      - name: Fetch pinned PUBLIC Mu-Silicium
        run: |
          set -euo pipefail
          git init -q mu
          git -C mu remote add origin "$MU_REPO"
          git -C mu fetch --depth 1 origin "$MU_SHA"
          git -C mu checkout -q FETCH_HEAD
          test "$(git -C mu rev-parse HEAD)" = "$MU_SHA"
          git -C mu submodule update --init --recursive --depth 1 --jobs 4

      - name: Restore SEC entry argument and publish UniXNU GUID HOB
        run: |
          set -euo pipefail
          python3 ci/patch_sec_entry_hob.py mu --dry-run
          python3 ci/patch_sec_entry_hob.py mu
          grep -q 'DIZI_ENTRY_ARG_HOB_V1' mu/Silicon/Silicium/SiliciumPkg/Sec/AArch64/ModuleEntryPoint.S
          grep -q 'DIZI_ENTRY_ARG_HOB_V1' mu/Silicon/Silicium/SiliciumPkg/Sec/Sec.c
          grep -q 'BuildGuidDataHob (&mDiziEntryArgHobGuid' mu/Silicon/Silicium/SiliciumPkg/Sec/Sec.c
          echo 'SEC x0-to-HOB handoff patched in firmware source'

      - name: Fetch pinned PUBLIC UniXNU
        run: |
          set -euo pipefail
          install -d mu/External/UniXNU
          git -C mu/External/UniXNU init -q
          git -C mu/External/UniXNU remote add origin "$UNIXNU_REPO"
          git -C mu/External/UniXNU fetch --depth 1 origin "$UNIXNU_SHA"
          git -C mu/External/UniXNU checkout -q FETCH_HEAD
          test "$(git -C mu/External/UniXNU rev-parse HEAD)" = "$UNIXNU_SHA"
          python3 ci/integrate_unixnu.py mu --dry-run
          python3 ci/integrate_unixnu.py mu
          python3 ci/patch_initrd_fat.py mu --dry-run
          python3 ci/patch_initrd_fat.py mu
          python3 ci/patch_public_buttons.py mu --dry-run
          python3 ci/patch_public_buttons.py mu
          echo '::group::Fetch pinned native R4 PMIC source'
          git -C mu fetch --depth 1 origin "$MU_R4_SHA"
          test "$(git -C mu rev-parse FETCH_HEAD)" = "$MU_R4_SHA"
          dizi_lib=mu/External/UniXNU/package/UniXNUPkg/Library/UniXNULib/Dizi
          mkdir -p "$dizi_lib"
          for src in DiziPmicKeys.c DiziPmicKeys.h DiziSpmiArbProbe.c DiziSpmiArbProbe.h DiziSpmiArbRead.c; do
            git -C mu show "$MU_R4_SHA:Platforms/Xiaomi/DiziBootPkg/BootSelector/$src" > "$dizi_lib/$src"
            test -s "$dizi_lib/$src"
          done
          echo '::endgroup::'
          python3 ci/patch_native_pmic_r4.py mu --dry-run
          python3 ci/patch_native_pmic_r4.py mu
          menu=mu/External/UniXNU/package/UniXNUPkg/Library/UniXNULib/Menu.c
          libinf=mu/External/UniXNU/package/UniXNUPkg/Library/UniXNULib/UniXNULib.inf
          grep -q 'DIZI_EFI_BUTTON_POLL_V2' "$menu"
          grep -q 'DiziPollEfiKey (&Key, &DiziKeySource)' "$menu"
          grep -q 'gEfiSimpleTextInputExProtocolGuid' "$menu"
          grep -q 'DiziWaitEfiKey (&Key)' "$menu"
          grep -q 'SCAN_VOLUME_UP' "$menu"
          grep -q 'SCAN_VOLUME_DOWN' "$menu"
          grep -q 'gEfiSimpleTextInputExProtocolGuid' "$libinf"
          grep -q 'DIZI_R4_PMIC_BRIDGE_V1' "$menu"
          grep -q 'DiziPollR4PmicKey (&Key)' "$menu"
          if grep -q 'DiziR4DrawStatus\|DiziShowInputStatus' "$menu"; then
            echo '::error::PMIC or EFI input diagnostics must not appear in normal menu'
            exit 1
          fi
          grep -q 'Dizi/DiziPmicKeys.c' "$libinf"
          grep -q 'Dizi/DiziSpmiArbRead.c' "$libinf"
          grep -q '^  IoLib$' "$libinf"
          if grep -q 'ConIn->WaitForKey' "$menu"; then
            echo '::error::Dizi UniXNU unexpectedly waits on ConIn key event'
            exit 1
          fi
          grep -q 'DIZI_FAT_AFTER_LZ4_V1' mu/External/UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.c
          grep -q 'DIZI_FAT_AFTER_LZ4_V1' mu/External/UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c

      - name: Make safe FAT32 menu (no XNU kernel provided)
        run: |
          set -euo pipefail
          mkdir -p dist
          truncate -s 64M dist/DIZI-UEFI-menu.fat
          mkfs.fat -F 32 -n DIZIUEFI dist/DIZI-UEFI-menu.fat
          mmd -i dist/DIZI-UEFI-menu.fat ::/EFI ::/EFI/UniXNU
          mcopy -i dist/DIZI-UEFI-menu.fat ci/firmware-menu.toml ::/EFI/UniXNU/unixnu.toml
          mtype -i dist/DIZI-UEFI-menu.fat ::/EFI/UniXNU/unixnu.toml | grep -q 'UEFI only'
          cp dist/DIZI-UEFI-menu.fat mu/Resources/ramdisk
          echo "UEFI ONLY. No XNU/ADT or Android dualboot. NEVER FLASH." > dist/NOT-FLASHABLE.txt
          {
            echo 'DIZI standalone UEFI-only test image'
            echo 'SEC: DIZI_ENTRY_ARG_HOB_V1 (ABL x0 -> GUID HOB)'
            echo 'Menu: DIZI_EFI_BUTTON_POLL_V2 (100ms timer, EFI TextIn + TextInEx; diagnostics hidden)'
            echo 'PMIC: DIZI_R4_PMIC_BRIDGE_V1 (Mu R4 71b8dedd; hardware buttons preserved, overlay hidden)'
            echo 'Initrd: DIZI_FAT_AFTER_LZ4_V1 (bounded FAT32 lookup)'
            echo 'Hardware validation: PENDING'
            echo 'Not for flashing; use temporary fastboot boot only.'
          } > dist/BOOT-PATCHES.txt

      - name: Compile Mu-Silicium firmware with public UniXNU
        run: |
          set -euo pipefail
          python3 -m venv mu/.venv
          mu/.venv/bin/python -m pip install --disable-pip-version-check -r mu/pip-requirements.txt
          source mu/.venv/bin/activate
          (cd mu && python3 build_uefi.py -d dizi -r RELEASE -c) 2>&1 | tee dist/build.log

      - name: Verify boot-v4 and collect reproducible binaries
        run: |
          set -euo pipefail
          install -m 0644 mu/Mu-dizi.img dist/Mu-dizi-UNIXNU-PUBLIC-UEFI-NOT-FLASHABLE.img
          install -m 0644 mu/Build/diziPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd dist/SILICIUM_UEFI-dizi-PUBLIC.fd
          python3 - <<'PY'
          import pathlib
          import struct
          boot=pathlib.Path("dist/Mu-dizi-UNIXNU-PUBLIC-UEFI-NOT-FLASHABLE.img").read_bytes()
          fat=pathlib.Path("dist/DIZI-UEFI-menu.fat").read_bytes()
          assert boot[:8]==b"ANDROID!"
          assert struct.unpack_from("<I",boot,40)[0]==4
          ksize=struct.unpack_from("<I",boot,8)[0]
          rsize=struct.unpack_from("<I",boot,12)[0]
          pos=4096+((ksize+4095)//4096)*4096
          assert rsize==len(fat), (rsize,len(fat))
          assert boot[pos:pos+rsize]==fat, "ramdisk differs from menu FAT"
          assert b"FAT32   " in fat[:512]
          print("Android boot-v4 image contains the checked standalone FAT32 menu")
          PY
          (cd dist && sha256sum Mu-dizi-UNIXNU-PUBLIC-UEFI-NOT-FLASHABLE.img SILICIUM_UEFI-dizi-PUBLIC.fd DIZI-UEFI-menu.fat > SHA256SUMS.txt)

      # Artifacts need no repository contents:write permission. Upload first
      # so a release API 403 cannot discard successfully built images.
      - name: Upload verified binaries to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dizi-public-uefi-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: |
            dist/Mu-dizi-UNIXNU-PUBLIC-UEFI-NOT-FLASHABLE.img
            dist/SILICIUM_UEFI-dizi-PUBLIC.fd
            dist/DIZI-UEFI-menu.fat
            dist/SHA256SUMS.txt
            dist/NOT-FLASHABLE.txt
            dist/BOOT-PATCHES.txt

      # GitHub may reject Release creation with HTTP 403 even when the job
      # reports Contents: write; previous jobs with the same scope succeeded.
      # Preserve the verified output independently of that API response.
      - name: Publish successful public-source test build
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dizi-public-uefi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            dist/Mu-dizi-UNIXNU-PUBLIC-UEFI-NOT-FLASHABLE.img \
            dist/SILICIUM_UEFI-dizi-PUBLIC.fd \
            dist/DIZI-UEFI-menu.fat \
            dist/SHA256SUMS.txt \
            dist/NOT-FLASHABLE.txt \
            dist/BOOT-PATCHES.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Dizi UEFI + upstream UniXNU (no XNU kernel) #$GITHUB_RUN_ID" \
            --notes-file dist/NOT-FLASHABLE.txt

      - name: Report publication result
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## Dizi verified boot image"
            echo "Download the files from **Actions → this workflow run → Artifacts**."
            echo "Artifact: dizi-public-uefi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} (retained 7 days)."
            if [ "$PUBLISH_OUTCOME" != "success" ]; then
              echo ""
              echo "⚠️ GitHub Releases returned an error despite the requested contents:write scope."
              echo "The Actions artifact remains available for download; check the publish step for the exact response."
            else
              echo ""
              echo "Release publishing succeeded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
