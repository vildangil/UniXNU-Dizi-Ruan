name: Dizi cleanup old diagnostic prereleases (owner manual only)

# One-time destructive release maintenance. No automatic schedule or push.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'vildangil' &&
       github.event.comment.body == '/cleanup-dizi-old-test-releases')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove only hard-coded old experimental prereleases, preserve 9 milestones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ci/cleanup_dizi_old_prereleases.sh
      - name: Save exact deleted-tag audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dizi-prerelease-cleanup-audit-${{ github.run_id }}
          path: cleanup-dizi-old-releases.log
          if-no-files-found: warn
          retention-days: 30
