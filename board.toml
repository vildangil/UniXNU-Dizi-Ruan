schema_version = 2

[board]
name = "dizi"
soc = "SM7435"
soc_source = "sm7435"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi Pad Pro"
kit = "dizi"

# Bring-up set: CPU, interrupts, timer and the UEFI GOP framebuffer only.
# Sheng (SM8550) storage, input, Wi-Fi and GPU components stay out until dizi
# equivalents exist.
[components]
include = [
    "ArmDTPlatform",
    "ArmCpu",
    "SoftwareAES",
    "GopFramebuffer",
    # UFS transport (sheng's driver; dizi has the same UFS host at 0x1d84000, SPI 265, with SMMU stream 0x20).
    "ShengUfs",
    # Data seed disk for /private/var (NativeRamBlock).
    "RamBlock",
    # SpringBoard needs a display and a key store (from the ruan port): the GOP framebuffer behind Apple's
    # IOMobileFramebufferLegacy, and an AppleKeyStore stand-in that reports "unlocked".
    "GopFramebuffer",
    "AppleKeyStoreState",
    "XnuPrelink",
    "DarwinBoot",
]

# The OS profile pins the IPSW, prelink roots and userdata windows.

[kernel]
defconfig = "dizi_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm7435.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# The arm64 profile's list plus the UFS root pieces, as the amethyst port does: ShengUfs bound to the original
# IOBlockStorageDevice taken from a previous prelinked kernel (no KDK), and sheng's PMGR bridge (pmgr=2).
# The candidate is a dizi kernel built without ShengUfs (out/.../candidate/bootstrap-candidate.macho; amethyst calls it
# the bootstrap candidate).
archives = [
    "build-corecrypto-14.py",
    "build-corecrypto-14.py --namespace",
    "component:ArmDTPlatform",
    "component:ArmCpu",
    "component:SoftwareAES",
    "build-software-aes-bindings.py",
    "build-mockfs-fixture.py",
    "build-libpthread-kernel.py",
    "component:ShengUfs",
    "build-ufs-original-bindings.py --candidate ../candidate/bootstrap-candidate.macho",
    "build-platform-power.py",
    "build-boot-progress-ruan.py",
    # The Data seed's disk (UniXNU RamBlock, NativeRamBlock), bound to the original IOBlockStorageDevice like ShengUfs.
    "component:RamBlock",
    "build-ufs-original-bindings.py --component NativeRamBlock --candidate ../candidate/bootstrap-candidate.macho",
    # The key store stand-in (package/KeyStoreProbe.cpp + AppleKeyStoreState), linked through CONFIG_XNU_EXTRA_LD_ARCHIVES.
    "component:AppleKeyStoreState",
    "build-keystore-probe.py",
    # The GOP display (package/LegacyDisplayProbe.cpp + GopFramebuffer NativeLegacyDisplay with package/gopfb-*.patch), bound to
    # the original IOMobileFramebufferLegacy of the previous dizi kernel (out/.../kernel); CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y.
    "build-gop-legacy-display.py",
]

# userdata on dizi: GPT entry 20 on UFS LUN 0, read by ShengUfs (native-ufs-probe=9, 2026-11-14), and
# fastboot partition-size 0x19B9DD3000 bytes (~110 GB, F2FS by stock), 4 KiB blocks. Both agree.
[userdata]
# Dual boot (2026-11-17): the old userdata (GPT entry 21, 0x35a228-0x1d13ffa) is split. Entry 22 "unixnu" (32 GiB) starts where
# userdata did and holds the iPadOS root; entry 21 "userdata" (70.9 GiB, its original GUIDs) follows it for Android.
# ShengUfs finds the root by name with native-ufs-partition=unixnu (kernel_args). Flash root images to unixnu, never userdata.
partition = "unixnu"
first_lba = 0x35a228
last_lba = 0xb5a227
lba_bytes = 4096

[device_tree]
source = "device:dts/dizi.dts"
include_dirs = ["soc:dts"]

[firmware]
# Mu-Silicium diziPkg (https://github.com/vildangil/Mu-Silicium).
config = "dizi"
dsc = "Platforms/Xiaomi/diziPkg/dizi.dsc"
fd = "Build/diziPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
# Same defaults as Mu-Silicium build_uefi.py (secure boot off, model 0).
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "0"
# Leave out the Windows Kernel Errata Patcher: its ExitBootServices hook faulted
# on dizi when handing off to XNU (old-ChatGPT branch hardware test, BdsDxe RVA 0x3EAC).
DISABLE_KEP = "1"

[bootimg]
# Bootloader DTB captured in Mu-Silicium Resources/DTBs/dizi.dtb.
dtb = "build/dizi/dizi.dtb"

[payload]
volume = "DIZIESP"
# dizi boot partition is 100 MiB. Payload holds about 50 MiB (kernel, ADT, trust cache); the boot image adds about 1.7 MiB (firmware, DTB). Up to about 96 is safe.
size_mib = 56
loader = "firmware"
title = "UniXNU"
# All 8 cores (4x A55 + 4x A78): needs sm7435-type-clusters.patch and the cluster ids in dts/dizi.dts.
# Tested on dizi 2026-11-14 with cpus=2 and cpus=8 (XNU reaches the root mount).
# No -v: it makes DarwinBoot's console text mode, so isMainDisplay() is false and backboardd never presents (ruan port).
# The offline-legacy-* args register NativeLegacyDisplay, bind it to the GOP framebuffer under /arm-io after IOKitBSDInit, power
# it for backboardd and CPU-copy every swap into the scanout (write-combined with fb-wc=1), with a 60 Hz vsync. aks=1 and
# offline-key-events=1 start the AppleKeyStore stand-in.
kernel_args = ["serial=3", "debug=0x14e", "cpus=8", "smp=1", "armcpu-spi-ipi=1", "armcpu-self-ipi=1", "native-ufs-partition=unixnu", "memory-outside=3",
  "offline-mobile-graphics-load=1", "offline-legacy-register=1", "offline-legacy-phase=4", "offline-legacy-gop=1",
  "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "vsync=60",
  "fb-wc=1", "aks=1", "offline-key-events=1"]
# Bring-up diagnostics (UniXNU docs/guide/debugging.md): blue band = kernel entry ran,
# magenta band = reached MMU enable; a kernel panic draws its message on the screen.
# 2026-11-14 on dizi: green, blue and magenta shown, then a reset about 6 s after
# MMU-on with entry_probe_reset_delay = 6. panic_screen does not fit next to that
# reset stage in this kernel's _start padding, so the reset is off here.
panic_screen = true

[payload.adt]
chip_id = "8011"
# iPadOS 17.7.11 (21H461) root volume, matched by UUID when native-ufs-root=1 publishes userdata.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# DarwinBoot window for XNU: the default 256 MiB (boot-progress mem=256M). ruan's 0xB0000000 does not fit dizi's UEFI memory
# map: DarwinBoot reported "NO WINDOW B0000000 BIG RUN 7AB00000 @ 840000000" (2026-11-15).
# Every window above the default 256 MiB failed (2026-11-17): 0x7A000000, 0x78000000 and 0x40000000 all froze the whole tablet about one
# second into BSD (clock stopped, irq=0), with or without the Data seed, and with the UFS DMA kept below 0x850000000
# (native-ufs-dma-max). 0x7A000000 also overlaps 0x8B9B00000+6M, a hole in ruan's Android /memory. dizi's low bank has almost no
# free memory (diziPkg MemoryMapLib), so every window starts at 0x840000000; the likely cause is RAM in that run that UEFI calls
# free but the hypervisor does not give to HLOS. Android's /sys/firmware/devicetree/base/memory would show which.
# owned_memory_size = "0x40000000"
unique_chip_id = "required"
# Free DRAM outside the window becomes VM memory (patches/xnu/dizi-memory-outside.patch, from the ruan port; memory-outside=3
# takes the runs above the window, within 4 GiB of it). DarwinBoot lists the 16 largest EfiConventionalMemory runs outside the
# window in /chosen/darwinboot-memory-outside; the kernel probes each page before it adopts it.
owned_memory_outside_ranges = 16
# Never adopted. From Linux's /proc/iomem on dizi (OrangeFox, 2026-11-17): System RAM is 0x800000000-0x83fcfffff,
# 0x840000000-0x8baafffff, 0x8bb100000-0x8bcefffff and 0x8c0000000-0x8ffffffff. Kept out:
#   0x80000000+2 GiB   the low bank (hypervisor, PIL, TZ, UEFI, the GOP scanout and the payload), as on ruan
#   0x830000000+256M   "HYP Reserved" in diziPkg's UEFI memory map
#   0x8bab00000+6M     not System RAM (the hole the 0x7A000000 window overlapped)
#   0x8bcf00000+49M    not System RAM, up to the 0x8c0000000 bank
owned_memory_outside_reserved = ["0x80000000:0x80000000", "0x830000000:0x10000000", "0x8BAB00000:0x600000", "0x8BCF00000:0x3100000"]
# The Data seed (make-data-seed.py, --data-ramdisk) is packed: DarwinBoot publishes it as PackedRAMDisk for NativeRamBlock.
packed_data_ramdisk = true

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "dizi_defconfig"

# dizi's firmware publishes no Apple PMGR. Without this flag AMFI waits for an
# ApplePMGRNub and panics with "AMFI: No PMGR?" at ConfigurationSettings.cpp:235
# (dizi panic screen 2026-11-14). Same fix as the vermeer port's ADT defaults.
[adt.defaults.u32]
vmm-present = 1

# Display scale for MobileGestalt/FrontBoard: 1600x2560 at 2x = 800x1280 points, as on ruan (same panel size).
[adt.chosen.u32]
display-scale = 2
display-rotation = 0
