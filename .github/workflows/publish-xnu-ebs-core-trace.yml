name: Publish verified DXE EBS 12-stage trace (manual only)

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'vildangil' &&
       github.event.comment.body == '/publish-dizi-ebs-core-trace')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TRACE_RUN: '40630906639'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified compiled trace without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$TRACE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "dizi-xnu-ebs-core-trace-$TRACE_RUN-1" --dir dist
          for name in Mu-dizi-XNU-EBS-CORE-TRACE-NO-XNU.img \
            SILICIUM_UEFI-dizi-EBS-CORE-TRACE.fd \
            DIZI-XNU-EBS-CORE-TRACE.fat SHA256SUMS.txt \
            ADT-REFERENCE-RESULT.json PRELINK-CHECK.json; do
            test -s "dist/$name"
          done
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          p=pathlib.Path('dist')
          boot=(p/'Mu-dizi-XNU-EBS-CORE-TRACE-NO-XNU.img').read_bytes()
          fat=(p/'DIZI-XNU-EBS-CORE-TRACE.fat').read_bytes()
          assert boot[:8]==b'ANDROID!'
          assert struct.unpack_from('<I',boot,40)[0]==4
          kern_size=struct.unpack_from('<I',boot,8)[0]
          ram_size=struct.unpack_from('<I',boot,12)[0]
          off=4096+((kern_size+4095)//4096)*4096
          assert ram_size==len(fat)==67108864
          assert boot[off:off+ram_size]==fat
          pre=json.loads((p/'PRELINK-CHECK.json').read_text())
          adt=json.loads((p/'ADT-REFERENCE-RESULT.json').read_text())
          assert pre['is_bootable'] is False and pre['kernel_entry_executed'] is False
          assert adt['kernel_entry_authorized'] is False
          print("VALIDATED: exact FAT32 and prelinked payload in boot-v4; NO XNU execution")
          PY

      - name: Rebuild only the missing release metadata and clean notes
        run: |
          set -euo pipefail
          printf '%s\n' \
            'DIZI DXE CORE 12-STAGE EBS TRACE, NOT BOOTABLE XNU' \
            'Source GitHub Actions build: 40630906639 (success)' \
            'The prelinked XNU/ADT are input data only. DarwinEnter is disabled.' \
            'Mu_Basecore DxeMain.c patched only in temporary CI checkout.' \
            '12 retained horizontal stripes below the wide yellow EBS boundary stripe.' \
            'No flash. Temporary fastboot boot ONLY; manual hard reboot required.' \
            > dist/BOOT-PATCHES.txt
          printf '%s\n' \
            'Dizi SM7435 EBS 12-stage diagnostic - NEVER FLASH' \
            '' \
            'This firmware deliberately does not execute XNU.' \
            'It reproduces the synchronous UEFI exception near 0xFC368EAC.' \
            'After the wide yellow DarwinBoot stripe, 12 cumulative narrow' \
            'colored bars show progress through DXE Core ExitBootServices:' \
            '0 Orange: before BeforeExitBootServices callbacks' \
            '1 Cyan: after BeforeExitBootServices callbacks' \
            '2 Pale cyan: before timer stop' \
            '3 Green: before CoreTerminateMemoryMap' \
            '4 Dark green: memory map terminated successfully' \
            '5 Blue: before ExitBootServices event callbacks' \
            '6 Purple: after ExitBootServices event callbacks' \
            '7 Magenta: before memory-protection callback' \
            '8 White: after memory-protection callback' \
            '9 Red: before disabling CPU interrupts' \
            '10 Yellow: after disabling interrupts' \
            '11 Lime: just before ExitBootServices returns successfully' \
            '' \
            'Photograph last visible narrow bar and exception PC.' \
            'If EBS succeeds, firmware intentionally halts; power reset.' \
            'Built from pinned public Mu-Silicium and UniXNU sources.' \
            'Build #40630906639 passed boot-v4, FAT32, XNU and ADT checks.' \
            > dist/NOT-BOOTABLE-XNU.txt
          test -s dist/BOOT-PATCHES.txt
          ! grep -q 'EOF          {' dist/NOT-BOOTABLE-XNU.txt

      # Legacy EBS diagnostic publisher: only one boot.img in rolling latest.
      - name: Publish one rolling boot.img, no FD/FAT binary release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ci/publish_dizi_latest_test.sh dist/Mu-dizi-XNU-EBS-CORE-TRACE-NO-XNU.img
