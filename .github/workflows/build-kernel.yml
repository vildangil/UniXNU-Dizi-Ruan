name: Build dizi kernel

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Choose the runner'
        required: true
        type: choice
        default: 'self-hosted'
        options:
          - 'macos-13'
          - 'macos-14'
          - 'macos-15'
          - 'macos-26'
          - 'self-hosted'
      defconfig:
        description: 'Kernel defconfig'
        required: true
        default: 'dizi_defconfig'
      publish_release:
        description: 'Publish as release'
        type: boolean
        default: false

env:
  UNIXNU_REPO: https://github.com/UniXNU/UniXNU
  DEVICE_REPO: https://github.com/vildangil/UniXNU-Dizi-Ruan
  DEVICE_DIR: UniXNU-Dizi-Ruan
  UNIXNU_DIR: UniXNU

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: ${{ env.UNIXNU_DIR }}
          submodules: recursive

      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          repository: vildangil/UniXNU-Dizi-Ruan
          path: ${{ env.DEVICE_DIR }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew install llvm lld dtc mtools
          pip install --upgrade pip

      - name: Cache XNU Sources
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.UNIXNU_DIR }}/out/feeds
            ${{ env.UNIXNU_DIR }}/out/dizi/ipados-17.7.11-21H461/dizi/tree/.cache
          key: ${{ runner.os }}-xnu-feeds-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-xnu-feeds-

      - name: Generate defconfig
        working-directory: ${{ env.UNIXNU_DIR }}
        run: |
          ./unixnu defconfig ${{ inputs.defconfig }} -D ../${{ env.DEVICE_DIR }}
          ./unixnu status --json -D ../${{ env.DEVICE_DIR }}

      - name: Fetch sources
        working-directory: ${{ env.UNIXNU_DIR }}
        run: |
          ./unixnu fetch -D ../${{ env.DEVICE_DIR }}

      - name: Build kernel
        working-directory: ${{ env.UNIXNU_DIR }}
        run: |
          ./unixnu build kernel -D ../${{ env.DEVICE_DIR }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dizi-kernel
          path: ${{ env.UNIXNU_DIR }}/out/dizi/kernel/
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.UNIXNU_DIR }}/out/dizi/kernel/*
          tag_name: dizi-kernel-${{ github.run_number }}
          name: Dizi kernel build ${{ github.run_number }}
          draft: true