name: Dizi XNU MMU A/B diagnostic boot (manual)

# Runs only on explicit manual dispatch. Never on push, PR, issue comments or a schedule.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Diagnostic branch from pinned fifth-NOSP base'
        type: choice
        required: true
        default: postmmu-b
        options:
          - sixth-a
          - sixth-b
          - orange-a
          - orange-b
          - postmmu-b
      publish_release:
        description: 'Replace the single dizi-xnu-latest-test release asset'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: dizi-xnu-latest-test-release
  cancel-in-progress: false

jobs:
  mmu-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Obtain and pin immutable, known fifth-NOSP base (without rebuilding EDK2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source dist
          base='source/Mu-dizi-XNU-FIVE-NOSP-BASE.img'
          expected='b2f22f83c9b55d5a89d60f7df42488486346754911153cc502256f686681371b'
          base_tag='dizi-xnu-five-nosp-base'
          if gh release view "$base_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$base_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'Mu-dizi-XNU-FIVE-NOSP-BASE.img' --dir source
          else
            # First run: snapshot the current latest Y504 source, if it still matches.
            if gh release download dizi-xnu-latest-test --repo "$GITHUB_REPOSITORY" \
              --pattern 'Mu-dizi-XNU-LATEST-TEST.img' --dir source; then
              mv source/Mu-dizi-XNU-LATEST-TEST.img "$base"
            fi
            if [ ! -f "$base" ] || ! (echo "$expected  $base" | sha256sum --check --status); then
              # The original CI artifact expires on 2026-11-11; baseline release
              # must be created before then if latest test was already replaced.
              rm -f "$base"
              gh run download 40756904707 --repo "$GITHUB_REPOSITORY" \
                --name dizi-xnu-five-nosp-40756904707 --dir source
              mv source/Mu-dizi-XNU-MMU-FIVE-NOSP-HIGH-RISK.img "$base"
            fi
            echo "$expected  $base" | sha256sum --check
            gh release create "$base_tag" "$base" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Dizi fixed Y504 fifth-NOSP baseline (do not overwrite)' \
              --notes 'Immutable SHA-pinned Y504 source for MMU A/B reproductions. Temporary fastboot boot only. This baseline must not be replaced by test images.'
          fi
          echo "$expected  $base" | sha256sum --check

      - name: Build selected MMU diagnostic image (no firmware rebuild)
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          python3 -m py_compile ci/build_dizi_mmu_variant.py ci/patch_dizi_post_mmu_b.py
          if [ "$VARIANT" = "postmmu-b" ]; then
            # Reconstruct the exact proven orange-b baseline, then patch ONLY
            # two post-SCTLR tracing locations. EDK2 stays byte-identical.
            python3 ci/build_dizi_mmu_variant.py \
              --input source/Mu-dizi-XNU-FIVE-NOSP-BASE.img \
              --variant orange-b --output-dir intermediate
            python3 ci/patch_dizi_post_mmu_b.py \
              --input intermediate/Mu-dizi-XNU-ORANGE-NOSP-B-NZCV-HIGH-RISK.img \
              --output dist/Mu-dizi-XNU-POST-SCTLR-B-HIGH-RISK.img \
              --report dist/MMU-AB-AUDIT.json
            (cd dist && sha256sum Mu-dizi-XNU-POST-SCTLR-B-HIGH-RISK.img > SHA256SUMS.txt)
          else
            python3 ci/build_dizi_mmu_variant.py \
              --input source/Mu-dizi-XNU-FIVE-NOSP-BASE.img \
              --variant "$VARIANT" --output-dir dist
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          test "$(find dist -maxdepth 1 -name '*.img' | wc -l)" -eq 1

      - name: Keep exact image and audit in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: dizi-mmu-ab-${{ inputs.variant }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
          path: |
            dist/*.img
            dist/*.json
            dist/SHA256SUMS.txt

      - name: Publish selected image to GitHub Release (only when requested)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(find dist -maxdepth 1 -name '*.img' -print -quit)"
          test -n "$image"
          bash ci/publish_dizi_latest_test.sh "$image"
          test "$(gh release view dizi-xnu-latest-test --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 1
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/dizi-xnu-latest-test" >> "$GITHUB_STEP_SUMMARY"
