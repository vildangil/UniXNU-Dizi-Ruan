name: Dizi standalone UEFI + UniXNU (public only)

# No private repositories, GitHub-hosted runners, or prebuilt XNU.
# Only manually dispatched; never runs on a push.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dizi-public-uefi
  cancel-in-progress: false

env:
  MU_REPO: https://github.com/vildangil/Mu-Silicium.git
  MU_SHA: 39fbbc20885325044cfeaf8428efb7267e0bbe35
  UNIXNU_REPO: https://github.com/UniXNU/UniXNU.git
  UNIXNU_SHA: 759eb61b6b8d475de5b3d1b39e1de1f5294e8d9a
  CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
  PYTHONUNBUFFERED: "1"
  CI_BUILD: "false"

jobs:
  uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install public cross-compilation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            clang-18 llvm-18 llvm-18-tools lld-18 nasm mono-devel \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu uuid-dev \
            python3-venv python3-pip make pkg-config curl git \
            dosfstools mtools
          mkdir -p "$RUNNER_TEMP/llvm-tools"
          for binary in llvm-lib lld-link llvm-objcopy; do
            if command -v "$binary" >/dev/null; then continue; fi
            candidate=""
            for p in "/usr/lib/llvm-18/bin/$binary" "/usr/bin/${binary}-18"; do
              if [ -x "$p" ]; then candidate="$p"; break; fi
            done
            test -n "$candidate" || { echo "::error::$binary not found"; exit 1; }
            ln -s "$candidate" "$RUNNER_TEMP/llvm-tools/$binary"
          done
          echo "$RUNNER_TEMP/llvm-tools" >> "$GITHUB_PATH"

      - name: Fetch pinned PUBLIC Mu-Silicium
        run: |
          set -euo pipefail
          git init -q mu
          git -C mu remote add origin "$MU_REPO"
          git -C mu fetch --depth 1 origin "$MU_SHA"
          git -C mu checkout -q FETCH_HEAD
          test "$(git -C mu rev-parse HEAD)" = "$MU_SHA"
          git -C mu submodule update --init --recursive --depth 1 --jobs 4

      - name: Fetch pinned PUBLIC UniXNU
        run: |
          set -euo pipefail
          install -d mu/External/UniXNU
          git -C mu/External/UniXNU init -q
          git -C mu/External/UniXNU remote add origin "$UNIXNU_REPO"
          git -C mu/External/UniXNU fetch --depth 1 origin "$UNIXNU_SHA"
          git -C mu/External/UniXNU checkout -q FETCH_HEAD
          test "$(git -C mu/External/UniXNU rev-parse HEAD)" = "$UNIXNU_SHA"
          python3 ci/integrate_unixnu.py mu --dry-run
          python3 ci/integrate_unixnu.py mu

      - name: Make safe FAT32 menu (no XNU kernel provided)
        run: |
          set -euo pipefail
          mkdir -p dist
          truncate -s 64M dist/DIZI-UEFI-menu.fat
          mkfs.fat -F 32 -n DIZIUEFI dist/DIZI-UEFI-menu.fat
          mmd -i dist/DIZI-UEFI-menu.fat ::/EFI ::/EFI/UniXNU
          mcopy -i dist/DIZI-UEFI-menu.fat ci/firmware-menu.toml ::/EFI/UniXNU/unixnu.toml
          mtype -i dist/DIZI-UEFI-menu.fat ::/EFI/UniXNU/unixnu.toml | grep -q 'UEFI only'
          cp dist/DIZI-UEFI-menu.fat mu/Resources/ramdisk
          echo "UEFI ONLY. No XNU/ADT or Android dualboot. NEVER FLASH." > dist/NOT-FLASHABLE.txt

      - name: Compile Mu-Silicium firmware with public UniXNU
        run: |
          set -euo pipefail
          python3 -m venv mu/.venv
          mu/.venv/bin/python -m pip install --disable-pip-version-check -r mu/pip-requirements.txt
          source mu/.venv/bin/activate
          (cd mu && python3 build_uefi.py -d dizi -r RELEASE -c) 2>&1 | tee dist/build.log

      - name: Verify boot-v4 and collect reproducible binaries
        run: |
          set -euo pipefail
          install -m 0644 mu/Mu-dizi.img dist/Mu-dizi-UNIXNU-PUBLIC-UEFI-NOT-FLASHABLE.img
          install -m 0644 mu/Build/diziPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd dist/SILICIUM_UEFI-dizi-PUBLIC.fd
          python3 - <<'PY'
          import pathlib
          import struct
          boot=pathlib.Path("dist/Mu-dizi-UNIXNU-PUBLIC-UEFI-NOT-FLASHABLE.img").read_bytes()
          fat=pathlib.Path("dist/DIZI-UEFI-menu.fat").read_bytes()
          assert boot[:8]==b"ANDROID!"
          assert struct.unpack_from("<I",boot,40)[0]==4
          ksize=struct.unpack_from("<I",boot,8)[0]
          rsize=struct.unpack_from("<I",boot,12)[0]
          pos=4096+((ksize+4095)//4096)*4096
          assert rsize==len(fat), (rsize,len(fat))
          assert boot[pos:pos+rsize]==fat, "ramdisk differs from menu FAT"
          assert b"FAT32   " in fat[:512]
          print("Android boot-v4 image contains the checked standalone FAT32 menu")
          PY
          (cd dist && sha256sum Mu-dizi-UNIXNU-PUBLIC-UEFI-NOT-FLASHABLE.img SILICIUM_UEFI-dizi-PUBLIC.fd DIZI-UEFI-menu.fat > SHA256SUMS.txt)

      - name: Publish successful public-source test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dizi-public-uefi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            dist/Mu-dizi-UNIXNU-PUBLIC-UEFI-NOT-FLASHABLE.img \
            dist/SILICIUM_UEFI-dizi-PUBLIC.fd \
            dist/DIZI-UEFI-menu.fat \
            dist/SHA256SUMS.txt \
            dist/NOT-FLASHABLE.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Dizi UEFI + upstream UniXNU (no XNU kernel) #$GITHUB_RUN_ID" \
            --notes-file dist/NOT-FLASHABLE.txt
