# Dizi EBS core callback trace after hardware yellow-line exception.
# Unlike actual first-entry, this NEVER calls DarwinEnter or enters XNU.
# It draws up to 12 cumulative colored stripes in DXE Core and then halts
# if ExitBootServices returns success; it does not return to UniXNU.
version = 1

[boot]
timeout = 60
fallback_timeout = 60
rotate = 0
default = "return"
connect_all = true

[ui]
title = "UniXNU / dizi DXE Core trace"
logo = true
layout = "portrait"
scale = 0
console = "auto"

[[entry]]
id = "return"
title = "Return to firmware (safe)"
type = "action"
action = "exit"

[[entry]]
id = "ebs-core-trace"
title = "DXE Core EBS stages (NO XNU)"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v keepsyms=1 debug=0x14e cpus=1"
confirm = "TRACE EFI CALLBACKS! Screen may HANG. POWER confirms."

[[entry]]
id = "restart"
title = "Restart tablet"
type = "action"
action = "reset"

[[entry]]
id = "shutdown"
title = "Power off tablet"
type = "action"
action = "shutdown"
