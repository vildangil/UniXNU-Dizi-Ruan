schema_version = 1

[device]
name = "dizi"
soc = "SM7435"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi Pad Pro (dizi), SM7435 (Parrot). Bring-up stage: CPU, interrupts, timer and GOP framebuffer through Mu-Silicium diziPkg. No hardware boot evidence yet."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["Identify the configuration hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for configuration."]
procedure = ["Follow the configuration stage in the porting guide and record the actual commands."]
findings = ["feeds.toml previously pinned an SM8550 commit, so status resolved the sm8550 SoC profile; it now pins sm7435-common and status reports soc sm7435.", "board.toml carries the bring-up component set, config fragments, patch series, device tree, Mu-Silicium firmware paths and a 56 MiB payload that fits the 100 MiB boot partition.", "The ADT declares vmm-present = 1: dizi firmware publishes no Apple PMGR and AMFI otherwise panics with 'AMFI: No PMGR?' at ConfigurationSettings.cpp:235."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Payload memory is the single 2 GiB DDR region0 at 0x80000000 that UniXNU's ADT generator requires; other RAM sizes are not checked."]
next_action = ["Add the root filesystem inputs (storage driver, userdata root image)."]
evidence = [{ kind = "source", reference = "board.toml", result = "unixnu status resolves soc sm7435, profile ipados-17.7.11-21H461 and the dizi patch order" }]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for firmware and boot."]
procedure = ["Follow the firmware and boot stage in the porting guide and record the actual commands."]
findings = ["Mu-Silicium diziPkg embeds UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot; Silicium SEC saves the bootloader x0 (FDT) in the entry-argument HOB.", "On dizi the initrd starts with the vendor_boot LZ4 legacy ramdisk (0x184C2102) followed by the FAT32 payload; UniXNURamDiskDxe now skips the LZ4 frames and publishes the payload, so the menu loads \\EFI\\UniXNU\\unixnu.toml.", "The Windows KEP ExitBootServices hook is left out with DISABLE_KEP; BootShim's image size covers the shim plus the FD.", "Volume and power keys use the PMIC/SPMI reader from the old-ChatGPT branch in diziPkg/Library/UniXNULibDizi; Volume Down timing was shortened and is not yet re-tested."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The UEFI vendor binaries in Mu-Silicium Binaries/dizi are documented as Redmi Note 13 Pro 5G firmware."]
next_action = ["Test Volume Down in the menu with the shortened guard."]
evidence = [{ kind = "source", reference = "https://github.com/vildangil/Mu-Silicium/tree/dizi-bringup", result = "DarwinBoot handoff with the green bar observed on dizi on 2026-11-14" }]

[[area]]
id = "cpu"
status = "device-verified"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["Identify the cpu and interrupts hardware, resources and existing component interfaces for this board."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for cpu and interrupts."]
procedure = ["Follow the cpu and interrupts stage in the porting guide and record the actual commands."]
findings = ["2026-11-14 on dizi with cpus=1: entry probe showed the blue (kernel entry) and magenta (pre-MMU) bands, and a reset after MMU-on.", "XNU then panicked at fiq_context_init writing CNTP_CTL_EL0: the hypervisor traps EL1 physical-timer access. sm7435-virtual-timer-only.patch removes that write.", "With the patch XNU passes arm_init, IOKit and AMFI and stops at 'Failed to mount root device' (IOKitBSDInit.cpp:984), which is expected without a root filesystem."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Secondary CPUs (SMP) are not started or tested; cpus=1 stays the default."]
next_action = ["Test SMP with an explicit cpus=2 run after root mount works."]
evidence = [{ kind = "device", reference = "https://github.com/vildangil/UniXNU-sm7435-common/commit/1765d1bc3601d288f00fa6f7be9b7634b4e10e18", command = "fastboot boot out/dizi/ipados-17.7.11-21H461/dizi/boot/boot.img", revision = "1765d1bc3601d288f00fa6f7be9b7634b4e10e18", result = "XNU reaches 'Failed to mount root device' at IOKitBSDInit.cpp:984 on the panic screen" }]

