name: Dizi device profile checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "board.toml"
      - "feeds.toml"
      - "configs/**"
      - "dts/**"
      - "package/unixnu.toml"
      - "porting.toml"
      - "ci/check_sm7435_smp.py"
      - "package/Sm7435PsciReadOnly.*"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate device identity and documented unimplemented stages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          def load(path):
              with (root / path).open("rb") as fh:
                  return tomllib.load(fh)

          board = load("board.toml")
          record = load("porting.toml")
          menu = load("package/unixnu.toml")
          device = board["board"]
          assert board["schema_version"] == 2
          assert device["name"] == "dizi"
          assert device["soc"] == "SM7435"
          assert device["example"] is True, "Keep native XNU builds disabled until SM7435 is validated"
          assert record["device"]["name"] == device["name"]
          assert record["device"]["soc"] == device["soc"]
          assert board["kernel"]["defconfig"] == "dizi_defconfig"
          assert (root / "configs/dizi_defconfig").is_file()
          assert (root / "dts/dizi.dts").is_file()
          feeds = load("feeds.toml")
          assert all("sm8550" not in str(source).lower() for source in feeds.get("source", []))
          assert menu["version"] == 1
          assert any(entry.get("type") == "xnu" for entry in menu["entry"])
          assert any(entry.get("action") == "exit" for entry in menu["entry"])
          observations = json.loads((root / "data/dizi-fdt-observed.json").read_text())
          assert observations["device"] == "dizi"
          assert observations["ram_candidate"]["validated_on_device"] is False
          required = {"configuration", "firmware", "cpu", "memory", "storage", "display",
                      "input", "gpu", "network", "audio", "power", "packaging", "diagnostics"}
          assert required <= {area["id"] for area in record["area"]}
          print("Dizi SM7435 device-port scaffolding: validated (not bootable)")
          PY
      - name: SM7435 SMP MPIDR/PSCI/GICR preflight (offline, no CPU_ON)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/check_sm7435_smp.py
          python3 ci/check_sm7435_smp.py --output sm7435-smp-audit.json
      - name: Compile source-only read-only eight-core PSCI SMC helper
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(command -v clang-18 || command -v clang)"
          test -n "$compiler"
          "$compiler" --target=aarch64-none-elf -ffreestanding -Wall -Wextra -Werror \
            -c package/Sm7435PsciReadOnly.c -o /tmp/Sm7435PsciReadOnly.o
      - name: Keep CPU topology audit for review
        uses: actions/upload-artifact@v4
        with:
          name: dizi-sm7435-smp-source-preflight
          path: sm7435-smp-audit.json
          if-no-files-found: error
          retention-days: 30
