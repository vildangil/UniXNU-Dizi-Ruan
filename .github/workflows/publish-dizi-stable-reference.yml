name: Dizi STABLE reference (owner manual; immutable)

# No push, PR or schedule trigger; only explicit owner command on control PR #1.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

concurrency:
  group: dizi-stable-reference
  cancel-in-progress: false

jobs:
  publish-stable:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'vildangil' &&
       github.event.comment.body == '/publish-dizi-stable-reference')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch exact hardware-observed first NO-SP image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download dizi-xnu-mmu-first-nosp-40700727875-1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Mu-dizi-XNU-MMU-FIRST-NOSP-HIGH-RISK.img' --dir dist
          echo 'ceb970d09e05aeff9e09293528d6193a87bf760c96a6e222766df6e73e249620  dist/Mu-dizi-XNU-MMU-FIRST-NOSP-HIGH-RISK.img' | sha256sum --check
      - name: Publish immutable STABLE reference release
        env:
          GH_TOKEN: ${{ github.token }}
          DIZI_SOURCE_RUN_ID: '40700727875'
        run: |
          set -euo pipefail
          bash ci/publish_dizi_channel.sh stable dist/Mu-dizi-XNU-MMU-FIRST-NOSP-HIGH-RISK.img
          echo "STABLE: https://github.com/$GITHUB_REPOSITORY/releases/tag/dizi-xnu-stable" >> "$GITHUB_STEP_SUMMARY"
