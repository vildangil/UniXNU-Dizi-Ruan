# Dizi EFI ExitBootServices boundary experiment.
# This does NOT execute XNU or DarwinEnter. Distinguishes exceptions in
# EFI debug, GetMemoryMap and ExitBootServices. No UEFI after success.
# Recovery is manual Power reset + boot to Android.
version = 1

[boot]
timeout = 60
fallback_timeout = 60
rotate = 0
default = "return"
connect_all = true

[ui]
title = "UniXNU / dizi EFI boundary"
logo = true
layout = "portrait"
scale = 0
console = "auto"

[[entry]]
id = "return"
title = "Return to firmware (safe)"
type = "action"
action = "exit"

[[entry]]
id = "ebs-boundary"
title = "EFI EXIT color probe (NO XNU execution)"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v keepsyms=1 debug=0x14e cpus=1"
confirm = "TEST EFI EXIT! Screen will HANG. POWER confirms."

[[entry]]
id = "restart"
title = "Restart tablet"
type = "action"
action = "reset"

[[entry]]
id = "shutdown"
title = "Power off tablet"
type = "action"
action = "shutdown"
