schema_version = 1

[device]
name = "dizi"
soc = "SM7435"
os_profile = "unselected"
summary = "Dizi EDK2/UniXNU and PMIC keys, Mach-O/ADT parsing are hardware-verified. XNU native source run 40569002417 and iPadOS17 prelink 40570765147 succeeded. On-device real-entry test release 40577187959 reached DarwinBoot pre-ExitBootServices print then raised EDK2 Synchronous Exception at 0xFC368EAC, without DarwinEnter green bar. No evidence XNU executed; SMP untested. EBS stage-color diagnostic added, still device-untested. Ruan unverified."

[[area]]
id = "configuration"
status = "planned"
components = []
paths = ["board.toml","feeds.toml","configs/dizi_defconfig","README.md"]
inputs = ["Obtain board-specific hardware observations and validated build sources."]
configuration = ["No sheng/SM8550 configuration or driver is selected."]
procedure = ["Review source pins and run the next safe on-device checkpoint."]
findings = ["Board example=true remains; public SM7435 common SoC pinned at 98d9b9bd with 8 CPU topology and PSCI/GICv3. The experimental runner builds raw XNU (40569002417) including XnuPrelink sparse-index/security-init ABI. Original iPadOS17.7.11/21H461 Apple kernelcache SHA256 f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7 verified against upstream profile, then successful host-only prelink run 40570765147 produced 51,941,376-byte ARM64 candidate; XnuPrelink explicitly reports runtime_qualified=false, loadable=false. No actual XNU execution."]
completion = ["Record reproducible host and hardware tests before claiming implementation."]
limits = ["XNU kernel entry and OS functionality are not confirmed on dizi or ruan."]
next_action = ["Compile and inspect the pinned SM7435 device tree and XNU source patch; select a compatible OS/kernelcache and independently verify DDR reservations before DarwinBoot handoff or SMP runtime experiments."]
evidence = []

