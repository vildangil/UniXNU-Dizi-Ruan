name: Dizi XNU fifth no-SP Y504 fast boot patch (manual)

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: dizi-xnu-latest-test-release
  cancel-in-progress: false

jobs:
  fifth-nosp:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'vildangil' &&
       github.event.comment.body == '/run-dizi-xnu-mmu-five-nosp')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned fourth no-SP image from the one-asset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source dist
          gh release download dizi-xnu-latest-test --repo "$GITHUB_REPOSITORY" \
            --pattern Mu-dizi-XNU-LATEST-TEST.img --dir source
          echo 'f38752d4b482d71280d2b72e70771c15d1cfc7e9680e5a2af6de4985bca6ec5c  source/Mu-dizi-XNU-LATEST-TEST.img' | sha256sum --check

      - name: Patch only fifth 84-byte Mach-O stub, preserve working EDK2
        run: |
          set -euo pipefail
          python3 -m py_compile ci/patch_dizi_fifth_mmu_stackless.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,subprocess,sys,tempfile
          src=Path('source/Mu-dizi-XNU-LATEST-TEST.img')
          out=Path('dist/Mu-dizi-XNU-MMU-FIVE-NOSP-HIGH-RISK.img')
          image=bytearray(src.read_bytes())
          sha=lambda d:hashlib.sha256(d).hexdigest()
          assert len(image)==68800512 and image[:8]==b'ANDROID!'
          assert struct.unpack_from('<I',image,40)[0]==4
          assert sha(image)=='f38752d4b482d71280d2b72e70771c15d1cfc7e9680e5a2af6de4985bca6ec5c'
          fat=memoryview(image)[0x19c000:0x19c000+64*1024*1024]
          assert fat[82:87].tobytes()==b'FAT32'
          assert (struct.unpack_from('<H',fat,11)[0],fat[13],struct.unpack_from('<H',fat,14)[0],fat[16],struct.unpack_from('<I',fat,36)[0],struct.unpack_from('<I',fat,44)[0])==(512,1,32,2,1009,2)
          kstart=0x19c000+0x101200
          klen=51941376
          old_kernel=bytes(image[kstart:kstart+klen])
          assert sha(old_kernel)=='b1ec254a0038208cad8ce4284ff759a33b096436208505cafc3e084be4361fa3'
          with tempfile.TemporaryDirectory() as d:
            p=Path(d)
            (p/'source.macho').write_bytes(old_kernel)
            subprocess.run([sys.executable,'ci/patch_dizi_fifth_mmu_stackless.py','--input',str(p/'source.macho'),'--output',str(p/'patched.macho'),'--report',str(p/'meta.json')],check=True)
            new_kernel=(p/'patched.macho').read_bytes()
            meta=json.loads((p/'meta.json').read_text())
          assert len(new_kernel)==klen
          assert sha(new_kernel)=='6758750c684e0569eea1c00be6726bb1409f6a3c0327a555de21b3b3d134f97c'
          assert meta['marker']=='DIZI_FIFTH_MMU_STAGE_STACKLESS_V1'
          assert meta['only_fifth_checkpoint_modified'] and meta['previous_four_stubs_preserved']
          assert meta['sixth_stack_stub_preserved'] and meta['native_ttbr1_sctlr_isb_untouched']
          kdiff=[i for i,(a,b) in enumerate(zip(old_kernel,new_kernel)) if a!=b]
          assert len(kdiff)==80 and min(kdiff)>=0x3ec7d8 and max(kdiff)<0x3ec82c
          image[kstart+0x3ec7d8:kstart+0x3ec82c]=new_kernel[0x3ec7d8:0x3ec82c]
          assert sha(image[kstart:kstart+klen])==meta['patched_sha256']
          out.write_bytes(image)
          audit={'source_boot_sha256':sha(src.read_bytes()),'patched_boot_sha256':sha(image),
            'source_macho_sha256':meta['source_sha256'],'patched_macho_sha256':meta['patched_sha256'],
            'changed_bytes':len(kdiff),'only_macho_probe_changed':True,
            'edk2_untouched':True,'source_boot_v4':4,'new_fifth_light_blue_y':[504,512],
            'mmu_enabled_on_hardware':False}
          Path('dist/FIFTH-NOSP-AUDIT.json').write_text(json.dumps(audit,indent=2)+'\n')
          print(json.dumps(audit,indent=2))
          PY
          (cd dist && sha256sum Mu-dizi-XNU-MMU-FIVE-NOSP-HIGH-RISK.img FIFTH-NOSP-AUDIT.json > SHA256SUMS.txt)

      - name: Save verified boot.img and audit in Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dizi-xnu-five-nosp-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
          path: |
            dist/Mu-dizi-XNU-MMU-FIVE-NOSP-HIGH-RISK.img
            dist/FIFTH-NOSP-AUDIT.json
            dist/SHA256SUMS.txt

      - name: Update ONE rolling prerelease, ONE boot.img asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ci/publish_dizi_latest_test.sh dist/Mu-dizi-XNU-MMU-FIVE-NOSP-HIGH-RISK.img
          test "$(gh release view dizi-xnu-latest-test --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 1
