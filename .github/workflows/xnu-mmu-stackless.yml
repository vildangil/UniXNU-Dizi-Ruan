name: Dizi XNU MMU stackless comparison (manual)

# No private repositories, GitHub-hosted runners, or prebuilt XNU.
# Explicit manual dispatch OR a trusted owner comment on control PR #1.
# NEVER triggers on push, pull_request, or synchronize.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

# Do not add a workflow-level concurrency gate: stalled workflow runs
# with zero created jobs can block all further manual dispatches.
env:
  MU_REPO: https://github.com/vildangil/Mu-Silicium.git
  MU_SHA: 39fbbc20885325044cfeaf8428efb7267e0bbe35
  MU_R4_SHA: 71b8dedd0c00f85eb5bcf10a647f0d698d81b6ac
  DARWINBOOT_REPO: https://github.com/UniXNU/DarwinBoot.git
  DARWINBOOT_SHA: 3325e352d7df68a9f9ad74832ed94a6acbbd7390
  XNU_PRELINK_RUN: "40570765147"
  ADT_UNIXNU_REPO: https://github.com/UniXNU/UniXNU.git
  ADT_UNIXNU_SHA: 0fc0fc1f9ddd0fbd4787738afef38667df5e0a95
  SM7435_REPO: https://github.com/vildangil/UniXNU-sm7435-common.git
  SM7435_SHA: 98d9b9bd35c530c2c9a4ea338fbabe5c341c005b
  UNIXNU_REPO: https://github.com/UniXNU/UniXNU.git
  UNIXNU_SHA: 759eb61b6b8d475de5b3d1b39e1de1f5294e8d9a
  CLANGPDB_AARCH64_PREFIX: aarch64-linux-gnu-
  PYTHONUNBUFFERED: "1"
  CI_BUILD: "false"

jobs:
  uefi:
    # Only the repository owner's exact command on control PR #1 is accepted.
    # Other GitHub comments create at most a skipped run, never a build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'vildangil' &&
       github.event.comment.body == '/run-dizi-xnu-mmu-stackless')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preflight pinned public inputs and safe XNU loader probe
        run: |
          set -euo pipefail
          python3 -m py_compile ci/integrate_unixnu.py ci/patch_initrd_fat.py ci/patch_sec_entry_hob.py ci/patch_public_buttons.py ci/patch_native_pmic_r4.py ci/patch_darwinboot_dizi.py ci/patch_darwinboot_first_entry.py ci/patch_darwinboot_post_ebs_handoff.py ci/patch_dizi_xnu_first_opcode.py ci/patch_dizi_xnu_start_first_cpu.py ci/patch_dizi_xnu_pre_mmu.py ci/patch_dizi_xnu_bootstrap_stages.py ci/patch_dizi_xnu_mmu_stackless_compare.py ci/patch_dizi_disable_kep_for_ebs.py ci/check_dizi_kep_bds_image.py ci/capture_dizi_dxecore_symbols.py ci/build_dizi_reference_adt.py ci/validate_prelinked_darwinboot.py
          python3 - <<'PY'
          import pathlib, tomllib
          w=pathlib.Path(".github/workflows/build.yml").read_text()
          assert ("dizi_" + "IpadOS_maybe") not in w
          assert "github.com/vildangil/Mu-Silicium.git" in w
          assert "github.com/UniXNU/UniXNU.git" in w
          data=tomllib.loads(pathlib.Path("ci/xnu-first-entry-menu.toml").read_text())
          assert data["version"] == 1
          assert data["boot"]["default"] == "return"
          assert [e.get("type") for e in data["entry"]].count("xnu") == 1
          assert "EXPERIMENTAL / NO RETURN" in data["entry"][1]["title"]
          assert data["entry"][1].get("confirm"), "Experiment must ask before testing"
          assert "POWER confirms" in data["entry"][1]["confirm"]
          assert data["entry"][1]["type"] == "xnu"
          assert data["entry"][1]["path"] == "Payloads/kernel.macho"
          # Config.c MakePath(UNIXNU_CONFIG_DIR, path): the relative
          # path must be *inside* EFI/UniXNU, not the FAT volume root.
          assert data["entry"][1]["path"].startswith("Payloads/")
          print("Resolved: /EFI/UniXNU/" + data["entry"][1]["path"])
          print("REAL XNU FIRST ENTRY user-confirmed with source prelink + reference ADT; NO UEFI RETURN")
          print("CONFIG RELATIVE FAT PATH: EFI/UniXNU/" + data["entry"][1]["path"])
          PY

      - name: Install public cross-compilation dependencies
        run: |
          set -euo pipefail
          # Azure apt archive proved extremely slow (114 MB still downloading
          # after 15 minutes, exit 124 on 2026-10-27). Prefer Ubuntu's public
          # archive with a second mirror, instead of a fixed Azure endpoint.
          mirror_file=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_file" ]; then
            printf '%s\n' \
              'https://archive.ubuntu.com/ubuntu/' \
              'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee "$mirror_file"
          fi
          echo "::group::Refreshing Ubuntu package lists (max 10 minutes)"
          timeout 600s sudo apt-get -o Acquire::Retries=1 \
            -o Acquire::https::Timeout=45 -o Acquire::http::Timeout=45 update
          echo "::endgroup::"
          echo "::group::Installing EDK2 cross-build tools (max 28 minutes)"
          timeout 1680s sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o DPkg::Lock::Timeout=180 -o Acquire::Retries=1 \
            -o Acquire::https::Timeout=45 -o Acquire::http::Timeout=45 \
            install -y --no-install-recommends \
              device-tree-compiler \
            clang-18 llvm-18 llvm-18-tools lld-18 nasm mono-devel \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu uuid-dev \
            python3-venv python3-pip make pkg-config curl git \
            dosfstools mtools
          echo "::endgroup::"
          echo "Host cross-build packages installed"
          mkdir -p "$RUNNER_TEMP/llvm-tools"
          for binary in llvm-lib lld-link llvm-objcopy; do
            if command -v "$binary" >/dev/null; then continue; fi
            candidate=""
            for p in "/usr/lib/llvm-18/bin/$binary" "/usr/bin/${binary}-18"; do
              if [ -x "$p" ]; then candidate="$p"; break; fi
            done
            test -n "$candidate" || { echo "::error::$binary not found"; exit 1; }
            ln -s "$candidate" "$RUNNER_TEMP/llvm-tools/$binary"
          done
          echo "$RUNNER_TEMP/llvm-tools" >> "$GITHUB_PATH"

      - name: Fetch pinned PUBLIC Mu-Silicium
        run: |
          set -euo pipefail
          git init -q mu
          git -C mu remote add origin "$MU_REPO"
          git -C mu fetch --depth 1 origin "$MU_SHA"
          git -C mu checkout -q FETCH_HEAD
          test "$(git -C mu rev-parse HEAD)" = "$MU_SHA"
          git -C mu submodule update --init --recursive --depth 1 --jobs 4

      - name: Disable Windows KEP handler in disposable Mu checkout only
        run: |
          set -euo pipefail
          test "$(git -C mu rev-parse HEAD)" = "$MU_SHA"
          python3 ci/patch_dizi_disable_kep_for_ebs.py mu --dry-run
          python3 ci/patch_dizi_disable_kep_for_ebs.py mu
          grep -q 'DIZI_NO_KEP_EBS_HOOK_V1' mu/Silicon/Silicium/SiliciumPkg/Library/KernelErrataPatcherLib/KernelErrataPatcherLib.c
          echo "Disabled Windows-specific BdsDxe gBS->ExitBootServices hook"

      - name: Restore SEC entry argument and publish UniXNU GUID HOB
        run: |
          set -euo pipefail
          python3 ci/patch_sec_entry_hob.py mu --dry-run
          python3 ci/patch_sec_entry_hob.py mu
          grep -q 'DIZI_ENTRY_ARG_HOB_V1' mu/Silicon/Silicium/SiliciumPkg/Sec/AArch64/ModuleEntryPoint.S
          grep -q 'DIZI_ENTRY_ARG_HOB_V1' mu/Silicon/Silicium/SiliciumPkg/Sec/Sec.c
          grep -q 'BuildGuidDataHob (&mDiziEntryArgHobGuid' mu/Silicon/Silicium/SiliciumPkg/Sec/Sec.c
          echo 'SEC x0-to-HOB handoff patched in firmware source'

      - name: Fetch pinned PUBLIC UniXNU
        run: |
          set -euo pipefail
          install -d mu/External/UniXNU
          git -C mu/External/UniXNU init -q
          git -C mu/External/UniXNU remote add origin "$UNIXNU_REPO"
          git -C mu/External/UniXNU fetch --depth 1 origin "$UNIXNU_SHA"
          git -C mu/External/UniXNU checkout -q FETCH_HEAD
          test "$(git -C mu/External/UniXNU rev-parse HEAD)" = "$UNIXNU_SHA"
          python3 ci/integrate_unixnu.py mu --dry-run
          python3 ci/integrate_unixnu.py mu
          python3 ci/patch_initrd_fat.py mu --dry-run
          python3 ci/patch_initrd_fat.py mu
          python3 ci/patch_public_buttons.py mu --dry-run
          python3 ci/patch_public_buttons.py mu
          echo '::group::Fetch pinned native R4 PMIC source'
          git -C mu fetch --depth 1 origin "$MU_R4_SHA"
          test "$(git -C mu rev-parse FETCH_HEAD)" = "$MU_R4_SHA"
          dizi_lib=mu/External/UniXNU/package/UniXNUPkg/Library/UniXNULib/Dizi
          mkdir -p "$dizi_lib"
          for src in DiziPmicKeys.c DiziPmicKeys.h DiziSpmiArbProbe.c DiziSpmiArbProbe.h DiziSpmiArbRead.c; do
            git -C mu show "$MU_R4_SHA:Platforms/Xiaomi/DiziBootPkg/BootSelector/$src" > "$dizi_lib/$src"
            test -s "$dizi_lib/$src"
          done
          echo '::endgroup::'
          python3 ci/patch_native_pmic_r4.py mu --dry-run
          python3 ci/patch_native_pmic_r4.py mu
          menu=mu/External/UniXNU/package/UniXNUPkg/Library/UniXNULib/Menu.c
          libinf=mu/External/UniXNU/package/UniXNUPkg/Library/UniXNULib/UniXNULib.inf
          grep -q 'DIZI_EFI_BUTTON_POLL_V2' "$menu"
          grep -q 'DiziPollEfiKey (&Key, &DiziKeySource)' "$menu"
          grep -q 'gEfiSimpleTextInputExProtocolGuid' "$menu"
          grep -q 'DiziWaitEfiKey (&Key)' "$menu"
          grep -q 'SCAN_VOLUME_UP' "$menu"
          grep -q 'SCAN_VOLUME_DOWN' "$menu"
          grep -q 'gEfiSimpleTextInputExProtocolGuid' "$libinf"
          grep -q 'DIZI_R4_PMIC_BRIDGE_V1' "$menu"
          grep -q 'DiziPollR4PmicKey (&Key)' "$menu"
          if grep -q 'DiziR4DrawStatus\|DiziShowInputStatus' "$menu"; then
            echo '::error::PMIC or EFI input diagnostics must not appear in normal menu'
            exit 1
          fi
          grep -q 'Dizi/DiziPmicKeys.c' "$libinf"
          grep -q 'Dizi/DiziSpmiArbRead.c' "$libinf"
          grep -q '^  IoLib$' "$libinf"
          if grep -q 'ConIn->WaitForKey' "$menu"; then
            echo '::error::Dizi UniXNU unexpectedly waits on ConIn key event'
            exit 1
          fi
          grep -q 'DIZI_FAT_AFTER_LZ4_V1' mu/External/UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.c
          grep -q 'DIZI_FAT_AFTER_LZ4_V1' mu/External/UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c

      - name: Fetch pinned PUBLIC DarwinBoot and add its UEFI loader protocol
        run: |
          set -euo pipefail
          git init -q mu/External/DarwinBoot
          git -C mu/External/DarwinBoot remote add origin "$DARWINBOOT_REPO"
          git -C mu/External/DarwinBoot fetch --depth 1 origin "$DARWINBOOT_SHA"
          git -C mu/External/DarwinBoot checkout -q FETCH_HEAD
          test "$(git -C mu/External/DarwinBoot rev-parse HEAD)" = "$DARWINBOOT_SHA"
          python3 ci/patch_darwinboot_dizi.py mu --dry-run
          python3 ci/patch_darwinboot_dizi.py mu
          grep -q 'DIZI_DARWINBOOT_PROBE_V1' mu/Platforms/Xiaomi/diziPkg/dizi.dsc
          grep -q 'DarwinBootPkg/Driver/DarwinBoot.inf' mu/Platforms/Xiaomi/diziPkg/dizi.fdf

      - name: Enable real DarwinEnter only after explicit UniXNU confirmation
        run: |
          set -euo pipefail
          python3 ci/patch_darwinboot_first_entry.py mu --dry-run
          python3 ci/patch_darwinboot_first_entry.py mu
          python3 ci/patch_darwinboot_post_ebs_handoff.py mu --dry-run
          python3 ci/patch_darwinboot_post_ebs_handoff.py mu
          driver=mu/External/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.c
          grep -q 'DIZI_XNU_REAL_FIRST_ENTRY_V1' "$driver"
          grep -q 'DIZI_XNU_POST_EBS_MARK_V1' "$driver"
          grep -q 'DiziPostEbsMark (Video);' "$driver"
          grep -q 'gBS->ExitBootServices (mImage, Key)' "$driver"
          grep -q 'DarwinEnter (ArgsAddress,' "$driver"
          ! grep -q 'DIZI_WINDOW_ALLOCATION_PROBE_V1' "$driver"
          ! grep -q 'DIZI_ADT_PARSE_PROBE_FAIL_CLOSED_V1' "$driver"
          grep -q 'if (Used > WindowSize - BLOCK_SIZE)' "$driver"

      - name: Fetch and verify pinned prelinked SM7435 plus iPadOS17 Mach-O
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p xnu-prelinked dist
          gh run download "$XNU_PRELINK_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "dizi-xnu-ipados17-PRELINK-CANDIDATE-LINUX-$XNU_PRELINK_RUN" \
            --dir xnu-prelinked
          python3 ci/validate_prelinked_darwinboot.py \
            --kernel xnu-prelinked/kernel.prelinked.dizi-CANDIDATE.macho \
            --report xnu-prelinked/PRELINK-RESULT.json \
            --source-run "$XNU_PRELINK_RUN" \
            --output dist/PRELINK-CHECK.json
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path("dist/PRELINK-CHECK.json").read_text())
          assert p["loader_shape_accepted"] and not p["is_bootable"]
          assert not p["kernel_entry_executed"] and not p["memory_allocated_on_device"]
          print("Source + iPadOS17 prelinked candidate verified; XNU execution remains blocked")
          PY

      - name: Instrument a verified COPY of pinned prelinked XNU Mach-O entry
        run: |
          set -euo pipefail
          mkdir -p xnu-probed
          python3 ci/patch_dizi_xnu_first_opcode.py \
            --input xnu-prelinked/kernel.prelinked.dizi-CANDIDATE.macho \
            --output xnu-probed/kernel.macho \
            --report dist/XNU-ENTRY-MARKER.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          original=pathlib.Path("xnu-prelinked/kernel.prelinked.dizi-CANDIDATE.macho")
          patched=pathlib.Path("xnu-probed/kernel.macho")
          report=json.loads(pathlib.Path("dist/XNU-ENTRY-MARKER.json").read_text())
          assert report["marker"]=="DIZI_XNU_ENTRY_WHITE_STRIPE_V1"
          assert report["source_sha256"]==hashlib.sha256(original.read_bytes()).hexdigest()
          assert report["patched_sha256"]==hashlib.sha256(patched.read_bytes()).hexdigest()
          assert original.stat().st_size==patched.stat().st_size
          assert report["original_kernel_not_modified"]
          assert report["white_band_y"]==[220,229]
          assert not report["xnu_executed_on_device"]
          print("Pinned XNU original remains untouched; white entry marker in a separate copy")
          PY

      - name: Hook start_first_cpu in a second SHA-pinned Mach-O COPY (CYAN Y240)
        run: |
          set -euo pipefail
          mkdir -p xnu-native-probed
          python3 ci/patch_dizi_xnu_start_first_cpu.py \
            --input xnu-probed/kernel.macho \
            --output xnu-native-probed/kernel.macho \
            --report dist/XNU-NATIVE-FIRST-CPU.json
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          source=pathlib.Path("xnu-probed/kernel.macho")
          native=pathlib.Path("xnu-native-probed/kernel.macho")
          o=json.loads(pathlib.Path("dist/XNU-NATIVE-FIRST-CPU.json").read_text())
          assert o["marker"]=="DIZI_XNU_START_FIRST_CPU_CYAN_V1"
          assert o["source_white_sha256"]==hashlib.sha256(source.read_bytes()).hexdigest()
          assert o["cyan_patched_sha256"]==hashlib.sha256(native.read_bytes()).hexdigest()
          assert o["original_source_macho_untouched"] is True
          assert o["cyan_band_y"]==[240,248]
          assert source.stat().st_size==native.stat().st_size
          assert o["native_start_first_cpu_va"]=="0xfffffff0073f205c"
          assert not o["runtime_verified"]
          assert o["cpu_count_requested"]==1
          print("Native start_first_cpu first word replay and CYAN stage verified in second copy")
          PY

      - name: Insert pre-MMU ORANGE diagnostic into third verified Mach-O COPY
        run: |
          set -euo pipefail
          mkdir -p xnu-mmu-probed
          python3 ci/patch_dizi_xnu_pre_mmu.py \
            --input xnu-native-probed/kernel.macho \
            --output xnu-mmu-probed/kernel.macho \
            --report dist/XNU-PRE-MMU-ORANGE.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          before=pathlib.Path("xnu-native-probed/kernel.macho")
          after=pathlib.Path("xnu-mmu-probed/kernel.macho")
          meta=json.loads(pathlib.Path("dist/XNU-PRE-MMU-ORANGE.json").read_text())
          assert meta["marker"]=="DIZI_XNU_PRE_MMU_ORANGE_V2"
          assert meta["source_cyan_sha256"]==hashlib.sha256(before.read_bytes()).hexdigest()
          assert meta["patched_sha256"]==hashlib.sha256(after.read_bytes()).hexdigest()
          assert before.stat().st_size==after.stat().st_size
          assert meta["msr_isb_untouched"] and meta["source_untouched"]
          assert meta["orange_band_y"]==[260,268]
          assert not meta["mmu_enabled_on_device"]
          assert meta["msr_va"]=="0xfffffff0073f2350"
          print("Verified original XNU MMU MSR/ISB remain in place, orange pre-MMU hook in disposable kernel copy")
          PY

      - name: Correct ORANGE marker and add five stackless early-bootstrap checkpoints
        run: |
          set -euo pipefail
          mkdir -p xnu-bootstrap-probed
          python3 ci/patch_dizi_xnu_bootstrap_stages.py \
            --input xnu-mmu-probed/kernel.macho \
            --output xnu-bootstrap-probed/kernel.macho \
            --report dist/XNU-BOOTSTRAP-STAGES.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          original=pathlib.Path("xnu-mmu-probed/kernel.macho")
          patched=pathlib.Path("xnu-bootstrap-probed/kernel.macho")
          d=json.loads(pathlib.Path("dist/XNU-BOOTSTRAP-STAGES.json").read_text())
          assert d["marker"]=="DIZI_XNU_EARLY_BOOTSTRAP_FIVE_BANDS_V1"
          assert d["source_sha256"]==hashlib.sha256(original.read_bytes()).hexdigest()
          assert d["patched_sha256"]==hashlib.sha256(patched.read_bytes()).hexdigest()
          assert original.stat().st_size==patched.stat().st_size
          assert d["mmu_msr_isb_unchanged"] and d["original_source_untouched"]
          assert len(d["stages"])==5
          assert d["orange_corrected_to"]=="0xffffa500"
          assert not d["xnu_mmu_boot_success_confirmed"]
          print("5 early XNU checkpoints inserted into fourth disposable Mach-O COPY")
          PY

      - name: Compare seven stackless pre-MMU checkpoints with previous SP-based probe
        run: |
          set -euo pipefail
          mkdir -p xnu-stackless-probed
          python3 ci/patch_dizi_xnu_mmu_stackless_compare.py \
            --input xnu-bootstrap-probed/kernel.macho \
            --output xnu-stackless-probed/kernel.macho \
            --report dist/XNU-MMU-STACKLESS-COMPARE.json
          python3 - <<'PY'
          import pathlib,hashlib,json
          before=pathlib.Path("xnu-bootstrap-probed/kernel.macho")
          after=pathlib.Path("xnu-stackless-probed/kernel.macho")
          d=json.loads(pathlib.Path("dist/XNU-MMU-STACKLESS-COMPARE.json").read_text())
          assert d["marker"]=="DIZI_XNU_MMU_STACKLESS_COMPARISON_V1"
          assert d["source_sha256"]==hashlib.sha256(before.read_bytes()).hexdigest()
          assert d["patched_sha256"]==hashlib.sha256(after.read_bytes()).hexdigest()
          assert d["size"]==before.stat().st_size==after.stat().st_size
          assert d["sctlr_msr_isb_unchanged"] and d["original_source_untouched"]
          assert d["no_stack_reads_or_writes_in_new_stubs"]
          assert d["scratch_regs_and_nzcv_clobbered"] # diagnostic, not production
          assert len(d["stages"])==7
          assert [x["y"][0] for x in d["stages"]]==[408,432,456,480,504,528,552]
          assert not d["on_device_verified"]
          print("Verified seven separate stackless probe stubs in pinned COPY")
          PY

      - name: Generate preliminary Apple ADT reference for eight Dizi CPUs
        run: |
          set -euo pipefail
          git init -q adt-tools
          git -C adt-tools remote add origin "$ADT_UNIXNU_REPO"
          git -C adt-tools fetch --depth 1 origin "$ADT_UNIXNU_SHA"
          git -C adt-tools checkout -q FETCH_HEAD
          test "$(git -C adt-tools rev-parse HEAD)" = "$ADT_UNIXNU_SHA"
          git init -q sm7435-src
          git -C sm7435-src remote add origin "$SM7435_REPO"
          git -C sm7435-src fetch --depth 1 origin "$SM7435_SHA"
          git -C sm7435-src checkout -q FETCH_HEAD
          test "$(git -C sm7435-src rev-parse HEAD)" = "$SM7435_SHA"
          python3 ci/build_dizi_reference_adt.py \
            --device "$PWD" --soc "$PWD/sm7435-src" \
            --unixnu "$PWD/adt-tools" --output "$PWD/adt-result"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('adt-result/ADT-REFERENCE-RESULT.json')
          d=json.loads(p.read_text())
          assert d['cpus']==8 and d['memory_ownership_verified'] is False
          assert d['kernel_entry_authorized'] is False
          assert 500 < d['adt_bytes'] < 100_000
          print('8 CPU ADT structurally generated, but runtime memory ownership UNVERIFIED; only physical manual opt-in allows entry')
          PY

      - name: Package kernel at UniXNU config-relative path (FAT32)
        run: |
          set -euo pipefail
          mkdir -p dist
          truncate -s 64M dist/DIZI-XNU-MMU-STACKLESS.fat
          mkfs.fat -F 32 -n DIZIPROBE dist/DIZI-XNU-MMU-STACKLESS.fat
          mmd -i dist/DIZI-XNU-MMU-STACKLESS.fat ::/EFI ::/EFI/UniXNU ::/EFI/UniXNU/Payloads
          mcopy -i dist/DIZI-XNU-MMU-STACKLESS.fat ci/xnu-first-entry-menu.toml ::/EFI/UniXNU/unixnu.toml
          echo "FAT: writing verified 51.9 MiB prelinked Mach-O"
          mcopy -i dist/DIZI-XNU-MMU-STACKLESS.fat xnu-stackless-probed/kernel.macho ::/EFI/UniXNU/Payloads/kernel.macho
          echo "FAT: Mach-O write finished"
          mcopy -i dist/DIZI-XNU-MMU-STACKLESS.fat adt-result/kernel.macho.adt ::/EFI/UniXNU/Payloads/kernel.macho.adt
          mtype -i dist/DIZI-XNU-MMU-STACKLESS.fat ::/EFI/UniXNU/unixnu.toml | grep -q 'EXECUTE XNU'
          echo "FAT: menu and prelinked kernel copied; verifying menu labels"
          mtype -i dist/DIZI-XNU-MMU-STACKLESS.fat ::/EFI/UniXNU/unixnu.toml | grep -q 'POWER confirms'
          echo "FAT: menu label verified; checking Mach-O and ADT readback"
          # Verify that the *normalized* relative entry path has a file.
          # A FAT-root /Payloads/ path will produce EFI_NOT_FOUND.
          mdir -i dist/DIZI-XNU-MMU-STACKLESS.fat ::/EFI/UniXNU/Payloads
          mcopy -i dist/DIZI-XNU-MMU-STACKLESS.fat -o ::/EFI/UniXNU/Payloads/kernel.macho "$RUNNER_TEMP/source-from-fat.macho"
          cmp -s xnu-stackless-probed/kernel.macho "$RUNNER_TEMP/source-from-fat.macho"
          mcopy -i dist/DIZI-XNU-MMU-STACKLESS.fat -o ::/EFI/UniXNU/Payloads/kernel.macho.adt "$RUNNER_TEMP/adt-from-fat.adt"
          cmp -s adt-result/kernel.macho.adt "$RUNNER_TEMP/adt-from-fat.adt"
          cp adt-result/ADT-REFERENCE-RESULT.json dist/ADT-REFERENCE-RESULT.json
          cp dist/DIZI-XNU-MMU-STACKLESS.fat mu/Resources/ramdisk
          cat > dist/NOT-BOOTABLE-XNU.txt <<'EOF'
          DIZI SM7435 FIRST REAL XNU ENTRY AFTER NO-KEP EBS SUCCESS - HIGH RISK!
          Hardware NO-KEP test on 2026-10-28 reached EFI_SUCCESS after EBS.
          WARNING: This image enters XNU; no guarantee that it will preserve memory
          or remain read-only after handoff. Back up data first.
          Handoff could hang, reset, black-screen, or require manual reboot.
          FAT layout: /EFI/UniXNU/Payloads/kernel.macho and kernel.macho.adt,
          because UniXNU resolves entry.path relative to /EFI/UniXNU.
          Android boot-v4 image enters EDK2/UniXNU with physical PMIC keys.
          FAT contains a separately instrumented COPY of the pinned ARM64
          prelinked XNU candidate and SM7435 reference Apple ADT.
          Validated original Mach-O SHA256 is preserved in XNU-ENTRY-MARKER.json.
          SEVEN NEW COMPARISON markers without SP access:
          HOT PINK Y408 immediately AFTER known purple _set_mmu_ttb return.
          CORAL Y432 before TTBR1_EL1; DARK ORANGE Y456 after TTBR1_EL1.
          GOLD Y480 before MAIR_EL1; TURQUOISE Y504 before TLBI.
          LIGHT BLUE Y528 before VBAR_EL1; FUCHSIA Y552 after VBAR_EL1.
          The prior 6-register checkpoint build showed NONE of its six
          new markers; those stubs used stack stores. These do not.
          They CLOBBER x9-x11 and NZCV like prior hardware-proven bands.
          This is a controlled diagnostic, NOT production-safe XNU.
          Original SCTLR_EL1/ISB and firmware unchanged.
          Stackless early-bootstrap color checkpoints:
          RED Y288=before first boot_args dereference (x20+8).
          YELLOW Y312=after boot_args reads including x20+0x470.
          GREEN Y336=after zeroing bootstrap page tables.
          BLUE Y360=completed page table descriptor setup, common_start entered.
          PURPLE Y384=return from _set_mmu_ttb.
          The previous ORANGE Y260 now uses the correct ARGB 0xFFFFA500.
          All five markers replay their pinned displaced instructions.
          ORANGE band Y260..268: kernel common_start reached immediately
          BEFORE enabling the XNU MMU with msr SCTLR_EL1, x0.
          Original MOVK is replayed in a checked cave; original MSR/ISB
          remain at their original addresses. No post-MMU state claimed.
          CYAN band Y240..248: first original instruction at
          start_first_cpu is replayed inside a second checked trampoline
          reached only by the native start_first_cpu function entry.
          Following this the trampoline branches back to start_first_cpu+4.
          White 9-row band Y220..229: injected first instruction at XNU image
          entry executed *after* DarwinEnter disabled MMU. This is NOT proof
          that the original XNU has initialized or printed a panic.
          Magenta Y172..195: real ExitBootServices returned EFI_SUCCESS.
          Green top Y0..159: inside DarwinEnter before MMU disabled.
          ADT includes 8 SM7435 CPUs/GICv3/PSCI and an observed 3 GiB RAM bank.
          RAM is NOT validated for XNU/EFI ownership. iPadOS identity is only a candidate.
          After explicit Power confirmation, DarwinBoot allocates 256MiB EFI RAM,
          writes prelinked XNU segments, passes Darwin23 boot_args+reference ADT,
          exits EFI BootServices, disables the EL1 MMU, branches to physical XNU.
          THIS HANDOFF CANNOT RETURN TO MENU. A hang or black screen is possible.
          The magenta Y172..195 band means EBS returned successfully.
          The green top band is painted BY THE LOADER before the kernel branch.
          Neither magenta nor green proves execution of XNU instructions.
          XNU-originating output or a symbolized ELR/exception is needed.
          Apple ABI and memory are NOT runtime-qualified, no root/userland, no validated trust cache.
          cpus=1 only, remaining seven CPUs intentionally not started.
          The Windows-only KernelErrataPatcherLib ReadyToBoot hook is disabled
          only in this test's disposable CI checkout.
          Normal DXE callbacks, PSCI and firmware remain unmodified outside CI.
          Use temporary fastboot boot only; NEVER fastboot flash.
          EOF
          {
            echo 'HIGH RISK: real DarwinBoot-to-XNU first entry, user must confirm'
            echo 'Input: DIZI_R4_PMIC_BRIDGE_V1 and DIZI_EFI_BUTTON_POLL_V2'
            echo "DarwinBoot commit: $DARWINBOOT_SHA"
            echo "XNU prelinked candidate run: $XNU_PRELINK_RUN"
            echo 'SHA-verified prelinked SM7435 XNU with pinned iPadOS 17.7.11 components, runtime UNQUALIFIED'
            echo 'DarwinEnter and ExitBootServices ENABLED; no fallback after handoff'
            echo 'Green top band = DarwinEnter pre-MMU-off, MAGENTA Y172 = EBS success'
            echo 'WHITE band Y220 = patched Mach-O entry executed after MMU off'
            echo 'CYAN band Y240 = native start_first_cpu first instruction replayed'
            echo 'ORANGE band Y260 = native common_start reached before SCTLR_EL1 MMU enable'
            echo 'Orange DOES NOT prove MMU enabling succeeded; original MSR/ISB unchanged'
            echo 'XNU MMU audit: XNU-PRE-MMU-ORANGE.json'
            echo 'EARLY CHECKPOINTS: RED Y288, YELLOW Y312, GREEN Y336, BLUE Y360, PURPLE Y384'
            echo 'Real orange ARGB corrected from 0xff00a5ff to 0xffffa500'
            echo 'Diagnostic report: XNU-BOOTSTRAP-STAGES.json'
            echo 'NEW NO-SP MMU COMPARISON Y408,432,456,480,504,528,552'
            echo 'Compare against prior stack-saving markers: XNU-MMU-STACKLESS-COMPARE.json'
            echo 'These new markers clobber scratch x9-x11 and NZCV; diagnostic only'
            echo 'Neither WHITE nor CYAN prove native XNU initialized'
            echo 'Original XNU binary remains unchanged; CI works only on a verified COPY'
            echo 'XNU patched image audit: XNU-ENTRY-MARKER.json'
            echo 'Static DarwinBoot loader validation: PRELINK-CHECK.json'
            echo 'Dizi kernel/ADT stored at /EFI/UniXNU/Payloads (fixed path)'
          } > dist/BOOT-PATCHES.txt

      - name: Compile Mu-Silicium firmware with public UniXNU
        run: |
          set -euo pipefail
          python3 -m venv mu/.venv
          mu/.venv/bin/python -m pip install --disable-pip-version-check -r mu/pip-requirements.txt
          source mu/.venv/bin/activate
          (cd mu && python3 build_uefi.py -d dizi -r RELEASE -c) 2>&1 | tee dist/build.log

      - name: Audit compiled BdsDxe NO-KEP and exact source-instrumented DXE Core
        run: |
          set -euo pipefail
          python3 ci/check_dizi_kep_bds_image.py mu dist
          test -s dist/KEP-BYPASS-CHECK.json
          test -s dist/bds-kep/BdsDxe.efi
          python3 ci/capture_dizi_dxecore_symbols.py mu dist
          test -s dist/DXECORE-RESULT.json
          test -s dist/dxe-core-symbols/DxeCore.efi

      - name: Verify boot-v4 and collect reproducible binaries
        run: |
          set -euo pipefail
          install -m 0644 mu/Mu-dizi.img dist/Mu-dizi-XNU-MMU-STACKLESS-HIGH-RISK.img
          install -m 0644 mu/Build/diziPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd dist/SILICIUM_UEFI-dizi-MMU-STACKLESS.fd
          python3 - <<'PY'
          import pathlib
          import struct
          boot=pathlib.Path("dist/Mu-dizi-XNU-MMU-STACKLESS-HIGH-RISK.img").read_bytes()
          fat=pathlib.Path("dist/DIZI-XNU-MMU-STACKLESS.fat").read_bytes()
          assert boot[:8]==b"ANDROID!"
          assert struct.unpack_from("<I",boot,40)[0]==4
          ksize=struct.unpack_from("<I",boot,8)[0]
          rsize=struct.unpack_from("<I",boot,12)[0]
          pos=4096+((ksize+4095)//4096)*4096
          assert rsize==len(fat), (rsize,len(fat))
          assert boot[pos:pos+rsize]==fat, "ramdisk differs from menu FAT"
          assert b"FAT32   " in fat[:512]
          assert b"Payloads/kernel.macho" not in boot[:4096], "No file paths expected in header"
          print("Android boot-v4 verified with prelinked XNU+ADT and ACTIVE DarwinEnter handoff")
          PY
          (cd dist && sha256sum Mu-dizi-XNU-MMU-STACKLESS-HIGH-RISK.img SILICIUM_UEFI-dizi-MMU-STACKLESS.fd DIZI-XNU-MMU-STACKLESS.fat ADT-REFERENCE-RESULT.json PRELINK-CHECK.json XNU-ENTRY-MARKER.json XNU-NATIVE-FIRST-CPU.json XNU-PRE-MMU-ORANGE.json XNU-BOOTSTRAP-STAGES.json XNU-MMU-STACKLESS-COMPARE.json KEP-BYPASS-CHECK.json bds-kep/BdsDxe.efi DXECORE-RESULT.json dxe-core-symbols/DxeCore.efi > SHA256SUMS.txt)

      # Artifacts need no repository contents:write permission. Upload first
      # so a release API 403 cannot discard successfully built images.
      - name: Upload verified binaries to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dizi-xnu-mmu-stackless-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          path: |
            dist/Mu-dizi-XNU-MMU-STACKLESS-HIGH-RISK.img
            dist/SILICIUM_UEFI-dizi-MMU-STACKLESS.fd
            dist/DIZI-XNU-MMU-STACKLESS.fat
            dist/SHA256SUMS.txt
            dist/NOT-BOOTABLE-XNU.txt
            dist/BOOT-PATCHES.txt
            dist/ADT-REFERENCE-RESULT.json
            dist/PRELINK-CHECK.json
            dist/XNU-ENTRY-MARKER.json
            dist/XNU-NATIVE-FIRST-CPU.json
            dist/XNU-PRE-MMU-ORANGE.json
            dist/XNU-BOOTSTRAP-STAGES.json
            dist/XNU-MMU-STACKLESS-COMPARE.json
            dist/KEP-BYPASS-CHECK.json
            dist/bds-kep/
            dist/DXECORE-RESULT.json
            dist/dxe-core-symbols/

      # GitHub may reject Release creation with HTTP 403 even when the job
      # reports Contents: write; previous jobs with the same scope succeeded.
      # Preserve the verified output independently of that API response.
      - name: Publish successful public-source test build
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dizi-xnu-mmu-stackless-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            dist/Mu-dizi-XNU-MMU-STACKLESS-HIGH-RISK.img \
            dist/SILICIUM_UEFI-dizi-MMU-STACKLESS.fd \
            dist/DIZI-XNU-MMU-STACKLESS.fat \
            dist/SHA256SUMS.txt \
            dist/NOT-BOOTABLE-XNU.txt \
            dist/BOOT-PATCHES.txt \
            dist/ADT-REFERENCE-RESULT.json \
            dist/PRELINK-CHECK.json \
            dist/XNU-ENTRY-MARKER.json \
            dist/XNU-NATIVE-FIRST-CPU.json \
            dist/XNU-PRE-MMU-ORANGE.json \
            dist/XNU-BOOTSTRAP-STAGES.json \
            dist/XNU-MMU-STACKLESS-COMPARE.json \
            dist/KEP-BYPASS-CHECK.json \
            dist/bds-kep/* \
            dist/DXECORE-RESULT.json \
            dist/dxe-core-symbols/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Dizi XNU MMU stackless A/B comparison NO-KEP (HIGH RISK) #$GITHUB_RUN_ID" \
            --notes-file dist/NOT-BOOTABLE-XNU.txt

      - name: Report publication result
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## Dizi XNU MMU STACKLESS A/B boot-v4 (HIGH RISK, NO ROLLBACK)"
            echo "Check **Actions → this workflow run → Artifacts** for a verified boot image."
            echo "Artifact: dizi-xnu-mmu-stackless-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} (retained 7 days)."
            if [ "$PUBLISH_OUTCOME" = "failure" ]; then
              echo ""
              echo "Release publication failed: check publish step. Artifact may still exist."
            elif [ "$PUBLISH_OUTCOME" = "skipped" ]; then
              echo ""
              echo "Build failed before publishing: no boot image artifact from this run."
            else
              echo ""
              echo "Release published. Actual XNU entry attempted ONLY if manually confirmed; iPadOS NOT functional."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
