schema_version = 2

[board]
name = "dizi"
soc = "SM7435"
soc_source = "sm7435"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi Pad Pro"
kit = "dizi"

# Bring-up set: CPU, interrupts, timer and the UEFI GOP framebuffer only.
# Sheng (SM8550) storage, input, Wi-Fi and GPU components stay out until dizi
# equivalents exist.
[components]
include = [
    "ArmDTPlatform",
    "ArmCpu",
    "SoftwareAES",
    "GopFramebuffer",
    "XnuPrelink",
    "DarwinBoot",
]

# The OS profile pins the IPSW, prelink roots and userdata windows.

[kernel]
defconfig = "dizi_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm7435.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/dizi.dts"
include_dirs = ["soc:dts"]

[firmware]
# Mu-Silicium diziPkg (https://github.com/vildangil/Mu-Silicium).
config = "dizi"
dsc = "Platforms/Xiaomi/diziPkg/dizi.dsc"
fd = "Build/diziPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
# Same defaults as Mu-Silicium build_uefi.py (secure boot off, model 0).
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "0"
# Leave out the Windows Kernel Errata Patcher: its ExitBootServices hook faulted
# on dizi when handing off to XNU (old-ChatGPT branch hardware test, BdsDxe RVA 0x3EAC).
DISABLE_KEP = "1"

[bootimg]
# Bootloader DTB captured in Mu-Silicium Resources/DTBs/dizi.dtb.
dtb = "build/dizi/dizi.dtb"

[payload]
volume = "DIZIESP"
# dizi boot partition is 100 MiB. Payload holds about 50 MiB (kernel, ADT, trust cache); the boot image adds about 1.7 MiB (firmware, DTB). Up to about 96 is safe.
size_mib = 56
loader = "firmware"
title = "UniXNU"
# cpus=1: secondary CPU startup is not confirmed on dizi yet (old-ChatGPT branch notes).
kernel_args = ["-v", "serial=3", "debug=0x14e", "cpus=1"]
# Bring-up diagnostics (UniXNU docs/guide/debugging.md): blue band = kernel entry ran,
# magenta band = reached MMU enable; a kernel panic draws its message on the screen.
# 2026-11-14 on dizi: green, blue and magenta shown, then a reset about 6 s after
# MMU-on with entry_probe_reset_delay = 6. panic_screen does not fit next to that
# reset stage in this kernel's _start padding, so the reset is off here.
panic_screen = true

[payload.adt]
chip_id = "8011"
unique_chip_id = "required"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "dizi_defconfig"

# dizi's firmware publishes no Apple PMGR. Without this flag AMFI waits for an
# ApplePMGRNub and panics with "AMFI: No PMGR?" at ConfigurationSettings.cpp:235
# (dizi panic screen 2026-11-14). Same fix as the vermeer port's ADT defaults.
[adt.defaults.u32]
vmm-present = 1
