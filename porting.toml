findings = ["Observed on dizi: temporary Android boot-v4 enters EDK2 and UniXNU GUI, PMIC keys operate the menu. Release dizi-xnu-adt-parse-probe-40562998521-1 displays Aborted when its XNU/ADT test is selected. DarwinBoot source confirms this is the injected guard after ParseKernel and AdtNode, before ReadBootVideo, AllocateWindow, ExitBootServices or DarwinEnter. No XNU kernel instruction executed."]
completion = ["Record reproducible host and hardware tests before claiming implementation."]
