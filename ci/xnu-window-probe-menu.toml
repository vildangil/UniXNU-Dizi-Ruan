# Explicit UEFI memory allocation checkpoint for SM7435.
# Kernel/ADT read and parse, then DarwinBoot tries a 256 MiB window,
# validates the EFI allocation result, FREES it and returns EFI_ABORTED.
# It never writes kernel code, exits boot services or executes XNU.
version = 1

[boot]
timeout = 60
fallback_timeout = 60
rotate = 0
default = "return"
connect_all = true

[ui]
title = "UniXNU / dizi RAM checkpoint"
logo = true
layout = "portrait"
scale = 0
console = "auto"

[[entry]]
id = "return"
title = "Return to firmware (safe)"
type = "action"
action = "exit"

[[entry]]
id = "window-efi-check"
title = "XNU memory check (NOT bootable)"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v cpus=1"
confirm = "Reserve+free 256 MiB EFI RAM? XNU is NOT executed."

[[entry]]
id = "restart"
title = "Restart tablet"
type = "action"
action = "reset"

[[entry]]
id = "shutdown"
title = "Power off tablet"
type = "action"
action = "shutdown"
