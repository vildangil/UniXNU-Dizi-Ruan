schema_version = 1

[device]
name = "dizi"
soc = "SM7435"
os_profile = "unselected"
summary = "On physical dizi, EDK2 and UniXNU menu/PMIC input work, ExitBootServices and DarwinEnter handoff have passed, and early instrumented XNU ARM64 start_first_cpu and bootstrap instructions run. 2026-10-29 hardware screenshot of pinned text-b run 40930881144 shows readable native XNU debug text reaching PRE SCTLR EL1, with old stripes removed. Previous orange-b run 40824108833 showed Y260 plus Y504/Y528. On 2026-10-31 corrected alias-b, on-device text POST SCTLR OK and GUARD PASSED now CONFIRMS MMU-on instruction execution and a working high-VA framebuffer alias. On 2026-10-31 physical deep-b then confirmed native TPIDR clear and the first instrumented _arm_init opcode on CPU0. Deeper _arm_init initialization, actual SMP secondary CPU startup and userland are NOT yet confirmed. Historical EBS exception was resolved by NO-KEP. Native full XNU profile remains incomplete; cpus=1 is still the safe default. Ruan and secondary CPU SMP remain unverified."

[[area]]
id = "configuration"
status = "planned"
components = []
paths = ["board.toml","feeds.toml","configs/dizi_defconfig","README.md"]
inputs = ["Obtain board-specific hardware observations and validated build sources."]
configuration = ["No sheng/SM8550 configuration or driver is selected."]
procedure = ["Review source pins and run the next safe on-device checkpoint."]
findings = ["Board example=true remains; public SM7435 common SoC pinned at 98d9b9bd with 8 CPU topology and PSCI/GICv3. The experimental runner builds raw XNU (40569002417) including XnuPrelink sparse-index/security-init ABI. Original iPadOS17.7.11/21H461 Apple kernelcache SHA256 f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7 verified against upstream profile, then successful host-only prelink run 40570765147 produced 51,941,376-byte ARM64 candidate; XnuPrelink reports runtime_qualified=false, loadable=false for the host candidate, but later diagnostic Mach-O entry and early XNU assembly (through pre-SCTLR Y260) were observed on physical dizi."]
completion = ["Record reproducible host and hardware tests before claiming implementation."]
limits = ["Early MMU-on and the first _arm_init instruction were hardware-confirmed on dizi; full _arm_init, other CPUs, kernel services and Ruan remain untested."]
next_action = ["Compile and inspect the pinned SM7435 device tree and XNU source patch; select a compatible OS/kernelcache and independently verify DDR reservations before DarwinBoot handoff or SMP runtime experiments."]
evidence = []

