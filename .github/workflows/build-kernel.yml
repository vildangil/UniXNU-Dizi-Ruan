name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: choice
        default: 'macos-15'
        options:
          - 'macos-13'
          - 'macos-14'
          - 'macos-15'
          - 'macos-26'
          - 'self-hosted'
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'dizi_defconfig'
      publish_release:
        description: 'Publish Release'
        type: boolean
        default: false

env:
  UNIXNU_REPO: https://github.com/UniXNU/UniXNU
  DEVICE_REPO: https://github.com/vildangil/UniXNU-Dizi-Ruan
  DEVICE_DIR: UniXNU-Dizi-Ruan
  UNIXNU_DIR: UniXNU

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: ${{ env.UNIXNU_DIR }}
          submodules: recursive

      - name: Checkout Device
        uses: actions/checkout@v4
        with:
          repository: vildangil/UniXNU-Dizi-Ruan
          path: ${{ env.DEVICE_DIR }}
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          tool-cache-path: ${{ github.workspace }}/.python-cache

      - name: Setup Brew
        if: ${{ inputs.runner == 'self-hosted' }}
        run: |
          echo "/usr/local/Homebrew/bin" >> $GITHUB_PATH
          echo "/usr/local/Homebrew/sbin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/sbin" >> $GITHUB_PATH

      - name: Setup Xcode
        if: ${{ inputs.runner == 'self-hosted' }}
        run: |
          sudo touch /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
          PROD=$(softwareupdate -l 2>/dev/null | grep -o '.*Command Line Tools.*' | head -1 | sed 's/^[* ]*//' || true)
          if [ -n "$PROD" ]; then
            sudo softwareupdate -i "$PROD" --verbose || true
          fi
          sudo rm -f /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
          sudo xcode-select -s /Library/Developer/CommandLineTools || true
          sudo xcodebuild -license accept || true

      - name: Install Dependencies
        run: |
          brew install llvm lld dtc mtools
          pip install --upgrade pip

      - name: Cache Sources
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.UNIXNU_DIR }}/out/feeds
            ${{ env.UNIXNU_DIR }}/out/dizi/ipados-17.7.11-21H461/dizi/tree/.cache
          key: ${{ runner.os }}-xnu-feeds-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-xnu-feeds-

      - name: Configure Kernel
        working-directory: ${{ env.UNIXNU_DIR }}
        run: |
          ./unixnu defconfig ${{ inputs.defconfig }} -D ../${{ env.DEVICE_DIR }}
          ./unixnu status --json -D ../${{ env.DEVICE_DIR }}

      - name: Fetch Sources
        working-directory: ${{ env.UNIXNU_DIR }}
        run: |
          ./unixnu fetch -D ../${{ env.DEVICE_DIR }}

      - name: Build Kernel
        working-directory: ${{ env.UNIXNU_DIR }}
        run: |
          ./unixnu build kernel -D ../${{ env.DEVICE_DIR }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dizi-kernel
          path: ${{ env.UNIXNU_DIR }}/out/dizi/kernel/
          if-no-files-found: error

      - name: Publish Release
        if: ${{ inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.UNIXNU_DIR }}/out/dizi/kernel/*
          tag_name: dizi-kernel-${{ github.run_number }}
          name: Dizi kernel build ${{ github.run_number }}
          draft: true
