# Incomplete device port. Native XNU builds are intentionally blocked.
schema_version = 2

[board]
name = "dizi"
soc = "SM7435"
description = "Xiaomi Redmi Pad Pro (dizi); ruan unverified"
kit = "dizi"
example = true

# UniXNU format 2: select only generic source components here.
# Device- and SoC-specific XNU support must not be borrowed from sheng/SM8550.
[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "dizi_defconfig"
# Shared ARM64 series can be resolved by the upstream UniXNU tool.
# The DIZI board series remains empty until the XNU port is reviewed.
config_fragments = ["arch:configs/common.config"]
patch_series = ["arch:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/dizi.dts"

[firmware]
config = "dizi"
dsc = "Platforms/Xiaomi/diziPkg/dizi.dsc"
fd = "Build/diziPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "dizi"

[payload]
volume = "DIZIXNU"
size_mib = 128
loader = "firmware"
title = "UniXNU / Dizi (experimental)"
kernel_args = ["-v", "cpus=1"]
