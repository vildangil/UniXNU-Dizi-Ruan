# Incomplete device port. Native XNU builds are intentionally blocked.
schema_version = 2

[board]
name = "dizi"
soc = "SM7435"
description = "Xiaomi Redmi Pad Pro (dizi); ruan unverified"
kit = "dizi"
example = true

[kernel]
defconfig = "dizi_defconfig"

[device_tree]
source = "device:dts/dizi.dts"

[firmware]
config = "dizi"
dsc = "Platforms/Xiaomi/diziPkg/dizi.dsc"
fd = "Build/diziPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "dizi"

[payload]
volume = "DIZIXNU"
size_mib = 128
loader = "firmware"
title = "UniXNU / Dizi (experimental)"
kernel_args = ["-v", "cpus=1"]
