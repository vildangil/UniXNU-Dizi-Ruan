name: Publish verified DXE EBS pointer + symbols (manual only)

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'vildangil' &&
       github.event.comment.body == '/publish-dizi-ebs-core-pointer')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TRACE_RUN: '40633998662'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified compiled trace without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$TRACE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "dizi-xnu-ebs-core-pointer-$TRACE_RUN-1" --dir dist
          for name in Mu-dizi-XNU-EBS-CORE-POINTER-NO-XNU.img \
            SILICIUM_UEFI-dizi-EBS-CORE-POINTER.fd \
            DIZI-XNU-EBS-CORE-POINTER.fat SHA256SUMS.txt \
            ADT-REFERENCE-RESULT.json PRELINK-CHECK.json \
            DXECORE-RESULT.json dxe-core-symbols/DxeCore.efi \
            dxe-core-symbols/DxeCore.dll dxe-core-symbols/DxeCore.map; do
            test -s "dist/$name"
          done
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          p=pathlib.Path('dist')
          boot=(p/'Mu-dizi-XNU-EBS-CORE-POINTER-NO-XNU.img').read_bytes()
          fat=(p/'DIZI-XNU-EBS-CORE-POINTER.fat').read_bytes()
          assert boot[:8]==b'ANDROID!'
          assert struct.unpack_from('<I',boot,40)[0]==4
          kern_size=struct.unpack_from('<I',boot,8)[0]
          ram_size=struct.unpack_from('<I',boot,12)[0]
          off=4096+((kern_size+4095)//4096)*4096
          assert ram_size==len(fat)==67108864
          assert boot[off:off+ram_size]==fat
          pre=json.loads((p/'PRELINK-CHECK.json').read_text())
          adt=json.loads((p/'ADT-REFERENCE-RESULT.json').read_text())
          assert pre['is_bootable'] is False and pre['kernel_entry_executed'] is False
          assert adt['kernel_entry_authorized'] is False
          core=json.loads((p/'DXECORE-RESULT.json').read_text())
          assert core['no_xnu_entry'] is True
          assert all(k in core['files'] for k in ('DxeCore.efi','DxeCore.dll','DxeCore.map'))
          print("VALIDATED: exact FAT32 and prelinked payload in boot-v4; NO XNU execution")
          PY

      - name: Prepare explicit reversible pointer-test notes
        run: |
          set -euo pipefail
          cat > dist/NOT-BOOTABLE-XNU.txt <<'EOF'
          Dizi / SM7435 EBS runtime pointer and DXE Core symbols experiment.
          This is an isolated UEFI firmware diagnostic, NOT bootable XNU.
          No DarwinEnter; successful ExitBootServices deliberately halts.
          Top wide YELLOW = pre-EBS. Twelve narrow DXE Core stage stripes
          occupy Y=84..228. White-on-navy hexadecimal digits at Y=244
          report the 64-bit gBS->ExitBootServices runtime function pointer.
          Photograph the digits, stripes, and full exception PC. With the
          DxeCore.map saved in this release we can derive the runtime image
          base and disassemble/symbolize the actual exception address.
          Absence of narrow stripes alone does not locate the exception.
          Before device test verify safe recovery; NEVER fastboot flash.
          Only temporary fastboot boot; expect a hard restart after EBS.
          The static prelinked XNU/ADT payload is NOT a verified kernel.
          EOF
          cat > dist/BOOT-PATCHES.txt <<'EOF'
          NO XNU ENTRY. DXE Core 12-stage EBS trace + 16-digit runtime EBS pointer.
          Pinned Mu_Basecore and DarwinBoot patched only in disposable CI checkout.
          Kernel/ADT packaging read-back and boot-v4 byte equality CI verified.
          Symbol maps and disassembly captured; runtime base still needs on-device photo.
          EOF

      - name: Publish original verified bytes as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dizi-xnu-ebs-core-pointer-$TRACE_RUN-1"
          files=(
            dist/Mu-dizi-XNU-EBS-CORE-POINTER-NO-XNU.img
            dist/SILICIUM_UEFI-dizi-EBS-CORE-POINTER.fd
            dist/DIZI-XNU-EBS-CORE-POINTER.fat
            dist/SHA256SUMS.txt
            dist/NOT-BOOTABLE-XNU.txt
            dist/BOOT-PATCHES.txt
            dist/ADT-REFERENCE-RESULT.json
            dist/PRELINK-CHECK.json
            dist/DXECORE-RESULT.json
            dist/dxe-core-symbols/DxeCore.efi
            dist/dxe-core-symbols/DxeCore.dll
            dist/dxe-core-symbols/DxeCore.map
            dist/dxe-core-symbols/DxeCore.disassembly.txt
            dist/dxe-core-symbols/DxeCore.pe-headers.txt
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Dizi EBS runtime pointer + DXE Core symbols (NO XNU)" \
              --notes-file dist/NOT-BOOTABLE-XNU.txt
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
