[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["board.toml", "dts/dizi.dts", "feeds.toml"]
inputs = ["Obtain board-specific hardware observations and validated build sources."]
configuration = ["Pinned SM7435 SoC fork with 8 Parrot CPU MPIDRs, PSCI=smc, GICv3 addresses and 0x20000 redistributor stride; no SM8550 power/GPU drivers selected."]
procedure = ["Review source pins and run the next safe on-device checkpoint."]
findings = ["Source-level SM7435 eight-CPU mapping staged; Aff1-aware reset vector patched unconditionally in pinned SM7435 common commit 22a71774c8ebf8ca6f2816bf774ff05d6b96e828. Offline topology validation and explicit opt-in cpus=2 profile added, but hardware CPU_ON remains untested. DarwinBoot successfully parsed on-device reference ADT containing eight CPU MPIDRs (released ADT parse probe #2). That earlier ADT parser probe deliberately skipped kernel entry; newer XNU pre-SCTLR instructions run on dizi but secondary CPU startup, IRQs and SMP remain untested. CPU0 _arm_init entry is hardware-confirmed by deep-b; arch-b register checks and offline memory audit are staged. cpus=1 stays default."]
completion = ["Record reproducible host and hardware tests before claiming implementation."]
limits = ["XNU kernel entry and OS functionality are not confirmed on dizi or ruan."]
next_action = ["First confirm native CPACR/TPIDR, return and _arm_init via deep-b; then read PSCI_VERSION/FEATURES/AFFINITY_INFO and GICR_TYPER without CPU_ON; verify ADT CPU_PHYS_ID alignment before optional cpus=2, IPI/timer, and eventual 8-core bringup."]
