# Prelinked kernel + observed ADT, but NO kernel entry. This is not iPadOS.
# DarwinBoot reads, parses, and requests a UEFI 256MiB window, then frees it.
# No ExitBootServices. No XNU instruction executed.
version = 1

[boot]
timeout = 60
fallback_timeout = 60
rotate = 0
default = "return"
connect_all = true

[ui]
title = "UniXNU / dizi PRELINK RAM check"
logo = true
layout = "portrait"
scale = 0
console = "auto"

[[entry]]
id = "return"
title = "Return to firmware (safe)"
type = "action"
action = "exit"

[[entry]]
id = "xnu-prelinked-window"
title = "Prelinked XNU memory check (NOT bootable)"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v cpus=1"
confirm = "Check prelinked XNU RAM only? XNU is NOT executed."

[[entry]]
id = "restart"
title = "Restart tablet"
type = "action"
action = "reset"

[[entry]]
id = "shutdown"
title = "Power off tablet"
type = "action"
action = "shutdown"
