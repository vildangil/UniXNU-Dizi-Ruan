name: Dizi XNU MMU A/B diagnostic boot (manual)

# Runs only on explicit manual dispatch. Never on push, PR, issue comments or a schedule.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Diagnostic branch from pinned fifth-NOSP base'
        type: choice
        required: true
        default: slot-b
        options:
          - sixth-a
          - sixth-b
          - orange-a
          - orange-b
          - postmmu-b
          - text-b
          - regs-b
          - walk-b
          - fbwalk-b
          - slot-b
          - alias-b
          - guard-b
          - deep-b
      publish_release:
        description: 'Replace the single dizi-xnu-latest-test release asset'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: dizi-xnu-latest-test-release
  cancel-in-progress: false

jobs:
  mmu-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Obtain and pin immutable, known fifth-NOSP base (without rebuilding EDK2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source dist
          base='source/Mu-dizi-XNU-FIVE-NOSP-BASE.img'
          expected='b2f22f83c9b55d5a89d60f7df42488486346754911153cc502256f686681371b'
          base_tag='dizi-xnu-five-nosp-base'
          if gh release view "$base_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$base_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'Mu-dizi-XNU-FIVE-NOSP-BASE.img' --dir source
          else
            # First run: snapshot the current latest Y504 source, if it still matches.
            if gh release download dizi-xnu-latest-test --repo "$GITHUB_REPOSITORY" \
              --pattern 'Mu-dizi-XNU-LATEST-TEST.img' --dir source; then
              mv source/Mu-dizi-XNU-LATEST-TEST.img "$base"
            fi
            if [ ! -f "$base" ] || ! (echo "$expected  $base" | sha256sum --check --status); then
              # The original CI artifact expires on 2026-11-11; baseline release
              # must be created before then if latest test was already replaced.
              rm -f "$base"
              gh run download 40756904707 --repo "$GITHUB_REPOSITORY" \
                --name dizi-xnu-five-nosp-40756904707 --dir source
              mv source/Mu-dizi-XNU-MMU-FIVE-NOSP-HIGH-RISK.img "$base"
            fi
            echo "$expected  $base" | sha256sum --check
            gh release create "$base_tag" "$base" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Dizi fixed Y504 fifth-NOSP baseline (do not overwrite)' \
              --notes 'Immutable SHA-pinned Y504 source for MMU A/B reproductions. Temporary fastboot boot only. This baseline must not be replaced by test images.'
          fi
          echo "$expected  $base" | sha256sum --check

      - name: Build selected MMU diagnostic image (no firmware rebuild)
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          python3 -m py_compile ci/build_dizi_mmu_variant.py ci/patch_dizi_post_mmu_b.py ci/patch_dizi_text_console_b.py ci/patch_dizi_mmu_registers_b.py ci/patch_dizi_mmu_walk_b.py ci/patch_dizi_mmu_fbwalk_b.py ci/patch_dizi_mmu_slot_b.py ci/patch_dizi_mmu_alias_b.py ci/patch_dizi_mmu_guard_b.py ci/patch_dizi_mmu_deep_b.py
          if [ "$VARIANT" = "postmmu-b" ] || [ "$VARIANT" = "text-b" ] || [ "$VARIANT" = "regs-b" ] || [ "$VARIANT" = "walk-b" ] || [ "$VARIANT" = "fbwalk-b" ] || [ "$VARIANT" = "slot-b" ] || [ "$VARIANT" = "alias-b" ] || [ "$VARIANT" = "guard-b" ] || [ "$VARIANT" = "deep-b" ]; then
            # Both variants start at the SHA-pinned orange-b from the immutable
            # fifth-NOSP release. Reconstruct the exact prior post-SCTLR image.
            python3 ci/build_dizi_mmu_variant.py \
              --input source/Mu-dizi-XNU-FIVE-NOSP-BASE.img \
              --variant orange-b --output-dir intermediate
            python3 ci/patch_dizi_post_mmu_b.py \
              --input intermediate/Mu-dizi-XNU-ORANGE-NOSP-B-NZCV-HIGH-RISK.img \
              --output intermediate/Mu-dizi-XNU-POST-SCTLR-B-HIGH-RISK.img \
              --report intermediate/POSTMMU-BASE-AUDIT.json
            if [ "$VARIANT" = "text-b" ] || [ "$VARIANT" = "regs-b" ] || [ "$VARIANT" = "walk-b" ] || [ "$VARIANT" = "fbwalk-b" ] || [ "$VARIANT" = "slot-b" ] || [ "$VARIANT" = "alias-b" ] || [ "$VARIANT" = "guard-b" ] || [ "$VARIANT" = "deep-b" ]; then
              # Recreate the exact hardware-tested text-b byte-for-byte
              # (SHA-256 25842763...), then optionally replace only its
              # diagnostic cave with real pre-SCTLR register readout.
              python3 ci/patch_dizi_text_console_b.py \
                --input intermediate/Mu-dizi-XNU-POST-SCTLR-B-HIGH-RISK.img \
                --output intermediate/Mu-dizi-XNU-TEXT-B-HIGH-RISK.img \
                --report intermediate/TEXT-B-BASE-AUDIT.json
              if [ "$VARIANT" = "regs-b" ] || [ "$VARIANT" = "walk-b" ] || [ "$VARIANT" = "fbwalk-b" ] || [ "$VARIANT" = "slot-b" ] || [ "$VARIANT" = "alias-b" ] || [ "$VARIANT" = "guard-b" ] || [ "$VARIANT" = "deep-b" ]; then
                # Rebuild the screenshot-confirmed regs-b with exact SHA.
                python3 ci/patch_dizi_mmu_registers_b.py \
                  --input intermediate/Mu-dizi-XNU-TEXT-B-HIGH-RISK.img \
                  --output intermediate/Mu-dizi-XNU-REGS-B-HIGH-RISK.img \
                  --report intermediate/REGS-B-BASE-AUDIT.json
                if [ "$VARIANT" = "walk-b" ] || [ "$VARIANT" = "fbwalk-b" ] || [ "$VARIANT" = "slot-b" ] || [ "$VARIANT" = "alias-b" ] || [ "$VARIANT" = "guard-b" ] || [ "$VARIANT" = "deep-b" ]; then
                  # Limited read-only pre-SCTLR L1/L2/L3 descriptor capture,
                  # from the SHA-pinned, locally verified 1569-byte ARM64 blob.
                  python3 ci/patch_dizi_mmu_walk_b.py \
                    --input intermediate/Mu-dizi-XNU-REGS-B-HIGH-RISK.img \
                    --output intermediate/Mu-dizi-XNU-WALK-B-HIGH-RISK.img \
                    --report intermediate/WALK-B-BASE-AUDIT.json
                  if [ "$VARIANT" = "slot-b" ] || [ "$VARIANT" = "alias-b" ] || [ "$VARIANT" = "guard-b" ] || [ "$VARIANT" = "deep-b" ]; then
                    # Reconstruct photographed slot-b byte-for-byte.
                    python3 ci/patch_dizi_mmu_slot_b.py \
                      --input intermediate/Mu-dizi-XNU-WALK-B-HIGH-RISK.img \
                      --output intermediate/Mu-dizi-XNU-SLOT-B-HIGH-RISK.img \
                      --report intermediate/SLOT-B-BASE-AUDIT.json
                    if [ "$VARIANT" = "deep-b" ]; then
                      # One full pre/post MMU trace: TPIDR, native return/BR,
                      # first _arm_init opcode and read-only BSP MPIDR check.
                      # Does NOT use PSCI CPU_ON or touch secondary cores.
                      python3 ci/patch_dizi_mmu_deep_b.py \
                        --input intermediate/Mu-dizi-XNU-SLOT-B-HIGH-RISK.img \
                        --output dist/Mu-dizi-XNU-DEEP-B-HIGH-RISK.img \
                        --report dist/MMU-AB-AUDIT.json
                      (cd dist && sha256sum Mu-dizi-XNU-DEEP-B-HIGH-RISK.img > SHA256SUMS.txt)
                    elif [ "$VARIANT" = "guard-b" ]; then
                      python3 ci/patch_dizi_mmu_guard_b.py \
                        --input intermediate/Mu-dizi-XNU-SLOT-B-HIGH-RISK.img \
                        --output dist/Mu-dizi-XNU-GUARD-B-HIGH-RISK.img \
                        --report dist/MMU-AB-AUDIT.json
                      (cd dist && sha256sum Mu-dizi-XNU-GUARD-B-HIGH-RISK.img > SHA256SUMS.txt)
                    elif [ "$VARIANT" = "alias-b" ]; then
                      # HIGH-RISK guarded TTBR1 Device alias and two
                      # post-SCTLR text checkpoints, no UEFI rebuild.
                      python3 ci/patch_dizi_mmu_alias_b.py \
                        --input intermediate/Mu-dizi-XNU-SLOT-B-HIGH-RISK.img \
                        --output dist/Mu-dizi-XNU-ALIAS-POSTMMU-B-HIGH-RISK.img \
                        --report dist/MMU-AB-AUDIT.json
                      (cd dist && sha256sum Mu-dizi-XNU-ALIAS-POSTMMU-B-HIGH-RISK.img > SHA256SUMS.txt)
                    else
                      cp intermediate/Mu-dizi-XNU-SLOT-B-HIGH-RISK.img dist/
                      cp intermediate/SLOT-B-BASE-AUDIT.json dist/MMU-AB-AUDIT.json
                      (cd dist && sha256sum Mu-dizi-XNU-SLOT-B-HIGH-RISK.img > SHA256SUMS.txt)
                    fi
                  elif [ "$VARIANT" = "fbwalk-b" ]; then
                    # Historical TTBR0 physical framebuffer VA probe.
                    python3 ci/patch_dizi_mmu_fbwalk_b.py \
                      --input intermediate/Mu-dizi-XNU-WALK-B-HIGH-RISK.img \
                      --output dist/Mu-dizi-XNU-FBMAP-B-HIGH-RISK.img \
                      --report dist/MMU-AB-AUDIT.json
                    (cd dist && sha256sum Mu-dizi-XNU-FBMAP-B-HIGH-RISK.img > SHA256SUMS.txt)
                  else
                    cp intermediate/Mu-dizi-XNU-WALK-B-HIGH-RISK.img dist/
                    cp intermediate/WALK-B-BASE-AUDIT.json dist/MMU-AB-AUDIT.json
                    (cd dist && sha256sum Mu-dizi-XNU-WALK-B-HIGH-RISK.img > SHA256SUMS.txt)
                  fi
                else
                  cp intermediate/Mu-dizi-XNU-REGS-B-HIGH-RISK.img dist/
                  cp intermediate/REGS-B-BASE-AUDIT.json dist/MMU-AB-AUDIT.json
                  (cd dist && sha256sum Mu-dizi-XNU-REGS-B-HIGH-RISK.img > SHA256SUMS.txt)
                fi
              else
                cp intermediate/Mu-dizi-XNU-TEXT-B-HIGH-RISK.img dist/
                cp intermediate/TEXT-B-BASE-AUDIT.json dist/MMU-AB-AUDIT.json
                (cd dist && sha256sum Mu-dizi-XNU-TEXT-B-HIGH-RISK.img > SHA256SUMS.txt)
              fi
            else
              cp intermediate/Mu-dizi-XNU-POST-SCTLR-B-HIGH-RISK.img dist/
              cp intermediate/POSTMMU-BASE-AUDIT.json dist/MMU-AB-AUDIT.json
              (cd dist && sha256sum Mu-dizi-XNU-POST-SCTLR-B-HIGH-RISK.img > SHA256SUMS.txt)
            fi
          else
            python3 ci/build_dizi_mmu_variant.py \
              --input source/Mu-dizi-XNU-FIVE-NOSP-BASE.img \
              --variant "$VARIANT" --output-dir dist
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          test "$(find dist -maxdepth 1 -name '*.img' | wc -l)" -eq 1

      - name: Keep exact image and audit in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: dizi-mmu-ab-${{ inputs.variant }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
          path: |
            dist/*.img
            dist/*.json
            dist/SHA256SUMS.txt

      - name: Publish selected image to GitHub Release (only when requested)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(find dist -maxdepth 1 -name '*.img' -print -quit)"
          test -n "$image"
          bash ci/publish_dizi_latest_test.sh "$image"
          test "$(gh release view dizi-xnu-latest-test --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 1
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/dizi-xnu-latest-test" >> "$GITHUB_STEP_SUMMARY"
