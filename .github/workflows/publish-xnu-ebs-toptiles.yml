name: Publish verified DXE EBS top-bar tiles (manual only)

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'vildangil' &&
       github.event.comment.body == '/publish-dizi-ebs-toptiles')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TRACE_RUN: '40635399461'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified compiled trace without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$TRACE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "dizi-xnu-ebs-toptiles-$TRACE_RUN-1" --dir dist
          for name in Mu-dizi-XNU-EBS-TOPTILES-NO-XNU.img \
            SILICIUM_UEFI-dizi-EBS-TOPTILES.fd \
            DIZI-XNU-EBS-TOPTILES.fat SHA256SUMS.txt \
            ADT-REFERENCE-RESULT.json PRELINK-CHECK.json \
            DXECORE-RESULT.json dxe-core-symbols/DxeCore.efi \
            dxe-core-symbols/DxeCore.dll dxe-core-symbols/DxeCore.map; do
            test -s "dist/$name"
          done
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          p=pathlib.Path('dist')
          boot=(p/'Mu-dizi-XNU-EBS-TOPTILES-NO-XNU.img').read_bytes()
          fat=(p/'DIZI-XNU-EBS-TOPTILES.fat').read_bytes()
          assert boot[:8]==b'ANDROID!'
          assert struct.unpack_from('<I',boot,40)[0]==4
          kern_size=struct.unpack_from('<I',boot,8)[0]
          ram_size=struct.unpack_from('<I',boot,12)[0]
          off=4096+((kern_size+4095)//4096)*4096
          assert ram_size==len(fat)==67108864
          assert boot[off:off+ram_size]==fat
          pre=json.loads((p/'PRELINK-CHECK.json').read_text())
          adt=json.loads((p/'ADT-REFERENCE-RESULT.json').read_text())
          assert pre['is_bootable'] is False and pre['kernel_entry_executed'] is False
          assert adt['kernel_entry_authorized'] is False
          core=json.loads((p/'DXECORE-RESULT.json').read_text())
          assert core['no_xnu_entry'] is True
          assert all(k in core['files'] for k in ('DxeCore.efi','DxeCore.dll','DxeCore.map'))
          print("VALIDATED: exact FAT32 and prelinked payload in boot-v4; NO XNU execution")
          PY

      - name: Prepare explicit reversible pointer-test notes
        run: |
          set -euo pipefail
          cat > dist/NOT-BOOTABLE-XNU.txt <<'EOF'
          Dizi/SM7435 NO-XNU EBS top-bar tile visibility diagnostic.
          12 NAVY outlined cells rendered AFTER the wide YELLOW marker
          and BEFORE the actual ExitBootServices call.
          Each completed DXE Core stage repaints its cell in stage color.
          First three checkpoints are expected before timer shutdown.
          White-on-navy hex digits at Y=244 = runtime EBS pointer.
          Photograph digits, exception PC and top 12 cells.
          Previous pointer photo: EBS=0xFC369E3C, PC=0xFC369EAC.
          If colors are missing, distinguish missing baseline cells from
          DXE store failure, bad framebuffer mapping or image mismatch.
          This firmware NEVER executes DarwinEnter/XNU.
          EBS may halt: hard restart, only temporary fastboot boot.
          NEVER fastboot flash.
          EOF
          cat > dist/BOOT-PATCHES.txt <<'EOF'
          NO XNU ENTRY: top-bar baseline and 12 DXE marker tiles.
          Pinned disposable CI checkout only, existing EDK2 untouched.
          Runtime EBS address at Y244; PE symbols and map preserved.
          EOF

      # Legacy EBS diagnostic publisher: only one boot.img in rolling latest.
      - name: Publish one rolling boot.img, no FD/FAT binary release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ci/publish_dizi_latest_test.sh dist/Mu-dizi-XNU-EBS-TOPTILES-NO-XNU.img
