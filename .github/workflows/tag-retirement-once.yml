name: ONE-TIME Dizi orphan Git tag pruning (23 only)

# This one-shot workflow runs when the exact audited manifest is first merged
# into main. It MUST be removed after successful execution. The push path
# restriction prevents runs on unrelated XNU commits or release publishing.
on:
  push:
    branches:
      - main
    paths:
      - docs/TAG_RETIREMENT_2026-10-29.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dizi-one-time-orphan-tag-prune
  cancel-in-progress: false

jobs:
  prune-orphans:
    if: github.repository == 'vildangil/UniXNU-Dizi-Ruan' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm SHA-pinned orphan-only deletion list (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile ci/retire_orphan_tags_once.py
          python3 ci/retire_orphan_tags_once.py --dry-run

      - name: Delete only the 23 approved non-release tag refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ci/retire_orphan_tags_once.py --execute

      - name: Cleanup note
        run: |
          echo "No releases, release assets, git commits, branches, or firmware images were intentionally removed."
          echo "Remove this one-off workflow file after a successful run."
